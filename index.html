<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coach</title>
<meta name="description" content="Coach – mat, trening og fremgang.">
<meta name="theme-color" content="#120e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('standalone');</script>
<style>
html { height: 100%; background: #120e0b; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; height: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; }
/* Hele skjermen, også under statuslinjen og hjem-streken på iPhone */
#root { position: fixed; inset: 0; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
/* Som app på hjemskjermen. Statuslinjen er nå heldekkende («black»): da går visningen helt ned på iOS 26 (WebKit bug 301108).
   Apper som ble lagt til med gammel innstilling, får i tillegg en litt høyere side, som får iOS til å bruke hele høyden. */
html.standalone, html.standalone body { background: #120e0b; }
@media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); } }
[hidden] { display: none !important; }
/* Layout: én kolonne, mobil først, i Apples formspråk: systemfont, grå grupperte flater med hvite kort,
   systemfarger (blå handlinger, grønn energi, indigo protein, oransje karbo, gul fett, turkis fiber), gjennomsiktig fanelinje. */
:root {
  color-scheme: dark;
  --bg: #120e0b;
  --surface: linear-gradient(160deg, rgba(255, 244, 232, .11), rgba(255, 244, 232, .035));
  --surface-flat: rgba(255, 244, 232, .07);
  --surface-solid: #241d18;
  --surface-2: rgba(255, 244, 232, .07);
  --surface-3: rgba(255, 244, 232, .12);
  --glass: rgba(34, 27, 22, .55);
  --glass-edge: rgba(255, 236, 214, .12);
  --ink: #fbf6f1;
  --ink-2: rgba(251, 246, 241, .66);
  --ink-3: rgba(251, 246, 241, .42);
  --rule: rgba(255, 236, 214, .09);
  --accent: #f4a261;
  --accent-2: #f7b77e;
  --accent-ink: #2a1708;
  --accent-soft: rgba(244, 162, 97, .16);
  --energy: #f4a261;
  --protein: #7cc4ff;
  --protein-soft: rgba(124, 196, 255, .16);
  --carbs: #f5d36b;
  --fat: #ff8a70;
  --fiber: #6fdc9a;
  --ok: #6fdc9a;
  --ok-soft: rgba(111, 220, 154, .16);
  --warn: #ffb35c;
  --warn-soft: rgba(255, 179, 92, .15);
  --bad: #ff6b5e;
  --bad-soft: rgba(255, 107, 94, .16);
  --bubble: rgba(255, 244, 232, .09);
  --track: rgba(255, 244, 232, .09);
  --shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
  --scrim: rgba(0, 0, 0, .5);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --r: 24px;
  --r-sm: 14px;
}

#root { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding-block: 10px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo svg { width: 26px; height: 26px; }
.brand .logo { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #22c1a8, #0f9f8f 55%, #2f6fd6) !important; box-shadow: 0 6px 16px rgba(15, 159, 143, .3); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
.brand .bt { font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: -.02em; line-height: 1.05; }
.brand small { display: block; font-family: var(--f-body); font-size: 12.5px; color: var(--ink-2); letter-spacing: 0; font-weight: 600; }
.topbar .spacer { flex: 1; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:hover { color: var(--ink); background: var(--surface-3); }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 28px; }
.view.chatview { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }

nav.tabs {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border-top: 1px solid var(--rule); box-shadow: 0 -6px 20px rgba(25, 40, 60, .05);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs button { background: none; border: 0; padding: 7px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: 0; min-width: 0; position: relative; }
nav.tabs button svg { width: 52px; height: 30px; padding: 4px 14px; border-radius: 15px; box-sizing: border-box; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] svg { background: var(--accent-soft); }
nav.tabs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h2.vh { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
h3 { font-size: 17px; font-weight: 800; color: var(--ink); }
.eyebrow { font-size: 12.5px; color: var(--ink-3); font-weight: 800; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }

/* Knapper og felter */
.btn { border: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--surface-3) inset; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px rgba(15, 159, 143, .3); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; }
.btn.danger { color: var(--bad); background: var(--bad-soft); box-shadow: none; }
.btn.sm { padding: 7px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.input, select.input, textarea.input {
  border: 1px solid var(--surface-3); background: var(--surface); border-radius: var(--r-sm); padding: 11px 13px; width: 100%; min-width: 0; color: var(--ink);
}
.input:focus { border-color: var(--accent); outline: none; }
.input::placeholder { color: var(--ink-3); }
textarea.input { resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }

/* Statusmerker */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.etikett, .pill.bruker, .pill.bekreftet { background: var(--ok-soft); color: var(--ok); }
.pill.offentlig, .pill.produsent { background: var(--protein-soft); color: var(--protein); }
.pill.estimat, .pill.verify { background: var(--warn-soft); color: var(--warn); }
.pill.foreslått { background: transparent; color: var(--ink-2); border: 1px dashed var(--ink-3); }
.pill.garmin { background: var(--accent-soft); color: var(--accent); }

/* Urskive (ringer) */
.ring svg { display: block; }
.ring .track { stroke: var(--surface-3); }
.face { display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); cursor: pointer; margin-bottom: 8px; }
.face .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.face .big { font-family: var(--f-display); font-weight: 900; font-size: 32px; line-height: .95; font-variant-numeric: tabular-nums; }
.face .big small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: .02em; }
.face .sub { font-size: 13px; color: var(--ink-2); }
.face .sub b { color: var(--protein); font-family: var(--f-display); font-size: 15px; }
.macrobar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macrobar .m { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.macrobar .m span { font-size: 12px; color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.macrobar .m b { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.protein > i { background: var(--protein); }
.bar.carbs > i { background: var(--carbs); }
.bar.fat > i { background: var(--fat); }
.bar.fiber > i { background: var(--fiber); }
.bar.over > i { background: var(--warn); }

/* Chat */
.messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-block: 8px 14px; }
.msg { max-width: 94%; display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-self: flex-end; align-items: flex-end; max-width: 86%; }
.msg .bubble { line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); padding: 10px 15px; border-radius: 20px 20px 6px 20px; white-space: pre-wrap; font-weight: 600; }
.msg.assistant .bubble { padding: 12px 15px; background: var(--surface); border-radius: 20px 20px 20px 6px; box-shadow: var(--shadow); }
.msg.assistant .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--ink-2); }
.msg.assistant .who i { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--fat)); display: inline-block; }
.msg.assistant .bubble.thinking { color: var(--ink-3); }
.msg.assistant .bubble.thinking::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 8px; vertical-align: middle; }
.msg .meta { font-size: 11.5px; color: var(--ink-3); }
.msg .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.msg .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 14px; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
.bubble h4 { font-family: var(--f-display); font-size: 16px; font-weight: 800; margin: 10px 0 4px; }
.bubble b { color: var(--ink); }
.bubble .tablewrap { overflow-x: auto; margin: 8px 0; background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; }
.bubble table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
.bubble th { font-size: 12px; color: var(--ink-3); font-weight: 800; }
.bubble th, .bubble td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.bubble tr:last-child td { border-bottom: 0; }
.bubble code { background: var(--surface-2); padding: 0 5px; border-radius: 5px; font-size: 14px; }
.actions { display: flex; flex-direction: column; gap: 4px; }
.actions:empty { display: none; }
.action { font-size: 14px; display: flex; gap: 8px; align-items: flex-start; color: var(--ink); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; box-shadow: var(--shadow); }
.action .mk { font-weight: 800; flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
.action.ok .mk { background: var(--ok-soft); color: var(--ok); }
.action.fail .mk { background: var(--bad-soft); color: var(--bad); }
.action.pend .mk { background: var(--surface-3); color: var(--ink-2); }

.proposal { border: 1.5px solid var(--accent); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; max-width: 440px; }
.proposal.saved { border-color: var(--ok); }
.proposal.rejected { opacity: .55; border-color: var(--rule); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.composer { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 12px; }
.composer .row { flex-wrap: nowrap; align-items: flex-end; gap: 8px; background: var(--surface); box-shadow: var(--shadow); border-radius: 26px; padding: 5px; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 150px; border: 0; background: transparent; padding: 10px 6px; line-height: 1.4; font-size: 16px; }
.composer textarea:focus { outline: none; }
.composer .attach { background: var(--surface-2); box-shadow: none; width: 44px; height: 44px; color: var(--accent); }
.pending-imgs { display: flex; gap: 8px; flex-wrap: wrap; }
.pending-imgs:empty { display: none; }
.pending-imgs .pi { position: relative; }
.pending-imgs img { width: 62px; height: 62px; object-fit: cover; border-radius: 12px; }
.pending-imgs button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ink); color: var(--surface); font-size: 14px; line-height: 1; font-weight: 700; }
.sendbtn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.sendbtn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.notice { font-size: 14px; padding: 10px 13px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--protein-soft); color: var(--protein); }

/* I dag: urskive-helt */
.datenav { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding-block: 4px 6px; }
.datenav .d { font-family: var(--f-display); font-weight: 800; font-size: 21px; text-align: center; flex: 1; }
.datenav .d small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-weight: 500; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 16px 20px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); }
.hero .dial { position: relative; width: 220px; max-width: 100%; aspect-ratio: 1; }
.hero .dial svg { width: 100%; height: 100%; }
.hero .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hero .center .eyebrow { font-size: 13px; }
.hero .center .n { font-family: var(--f-display); font-weight: 900; font-size: 52px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hero .center .n.over { color: var(--warn); }
.hero .center .of { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.hero .legend { display: flex; gap: 18px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; justify-content: center; }
.hero .legend b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tile .k { font-size: 12px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.tile .t { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles .tile .t:empty { display: none; }
.tile.protein .v { color: var(--protein); }
.tile.carbs .v { color: var(--carbs); }
.tile.fat .v { color: var(--fat); }
.tile.fiber .v { color: var(--fiber); }
.garminrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-top: 10px; }
.garminrow .tile .v { font-size: 20px; }

/* Måltider */
.slot { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.slot > header { display: flex; align-items: center; gap: 10px; }
.slot .sd { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.slot .sd.frokost { background: #f2a93b; } .slot .sd.lunsj { background: #7cb342; } .slot .sd.middag { background: #0f9f8f; } .slot .sd.kvelds { background: #3d6fe0; }
.slot .st { font-family: var(--f-display); font-weight: 800; font-size: 17px; flex: 1; min-width: 0; }
.slot .mk { font-family: var(--f-display); font-weight: 800; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.15; }
.slot .mk em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--protein); }
.addbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 700; line-height: 1; flex: none; display: grid; place-items: center; }
.addbtn:hover { background: var(--accent); color: var(--accent-ink); }
.slotempty { border: 1.5px dashed var(--surface-3); background: transparent; border-radius: var(--r-sm); padding: 10px; color: var(--ink-3); font-weight: 700; font-size: 14px; }
.slotempty:hover { border-color: var(--accent); color: var(--accent); }
.slot.isempty { box-shadow: none; background: rgba(255, 255, 255, .55); }
.meal { border-top: 1px solid var(--rule); padding-top: 8px; }
.meal .mhead { display: flex; align-items: center; gap: 8px; }
.meal .mhead .mn { font-weight: 700; font-size: 14px; color: var(--ink-2); flex: 1; min-width: 0; }
.meal header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meal header .mt { font-family: var(--f-display); font-weight: 800; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; text-transform: capitalize; }
.meal header .mn { font-weight: 600; flex: 1; min-width: 0; font-size: 15px; }
.meal header .mk { font-family: var(--f-display); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meal header .mk em { font-style: normal; color: var(--protein); margin-left: 6px; font-size: 15px; }
.items { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 6px; }
.items td { padding: 7px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.items td.n { padding-right: 8px; }
.items td.n .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 14px; line-height: 1.3; }
.items td.n .sub { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.items td.a { width: 78px; }
.items td.k { font-family: var(--f-display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; width: 62px; line-height: 1.15; }
.items td.k span { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-left: 2px; }
.items td.k em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--protein); }
.items td.x { width: 28px; text-align: right; }
.amt { display: flex; align-items: center; gap: 3px; }
.amt input { width: 54px; padding: 5px 7px; border: 1px solid transparent; border-radius: 10px; background: var(--surface-2); font-family: var(--f-display); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.amt input:focus { border-color: var(--accent); outline: none; }
.amt span { font-size: 12px; color: var(--ink-3); }
.xbtn { border: 0; background: none; color: var(--ink-3); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; }
.xbtn:hover { background: var(--bad-soft); color: var(--bad); }
.est { color: var(--warn); font-weight: 800; margin-left: 2px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 0; border-radius: var(--r-sm); box-shadow: var(--shadow); text-align: left; width: 100%; color: var(--ink); }
button.li:hover { background: var(--surface-2); }
.li .grow { flex: 1; min-width: 0; }
.li .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t2 { font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .kc { font-family: var(--f-display); font-size: 18px; font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.1; }
.li .kc em { display: block; font-style: normal; color: var(--protein); font-size: 15px; }
.li .kc .faint { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; }

.tbl { overflow-x: auto; background: var(--surface); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 4px 12px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 800; padding: 8px 10px 8px 0; white-space: nowrap; }
.tbl td { padding: 8px 10px 8px 0; border-top: 1px solid var(--rule); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.r { font-family: var(--f-display); font-size: 15px; }
.tbl tr.total td { font-weight: 700; color: var(--accent); }

/* Næringsdeklarasjon i produktark */
.label { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; }
.label .lh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.label .lh h3 { color: var(--ink); }
.label .lrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.label .lrow:last-child { border-bottom: 0; }
.label .lrow.sub { padding-left: 14px; color: var(--ink-2); font-size: 14px; }
.label .lrow .v { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; text-align: right; }
.label .lrow .t { font-size: 12px; color: var(--ink-3); text-align: right; }
.label .lrow.protein .v { color: var(--protein); }

/* Ark (modal) */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 720px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; border-top: 1px solid var(--rule);
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 10px; }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.sheet .sh h2 { font-size: 24px; font-weight: 800; flex: 1; min-width: 0; line-height: 1.1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-size: 14.5px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 12px 30px rgba(20, 30, 45, .3); }
.toast button { background: none; border: 0; color: var(--accent-2); font-weight: 800; }

.empty { text-align: center; padding: 28px 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 22px; }
.chart { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--f-display); font-size: 11px; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 14px; font-weight: 600; border-radius: 999px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
details { background: var(--surface); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 10px 14px; }
details > summary { cursor: pointer; font-weight: 600; }
details .tbl { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14.5px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
a { color: var(--accent); }
label.row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.statline { display: flex; gap: 8px; flex-wrap: wrap; }
/* Flyt: raske, myke overganger. Ingenting animeres på nytt når innholdet ikke er endret. */
html, body { overscroll-behavior: none; }
.view, .messages, .sheet { overscroll-behavior: contain; }
button, .li, .chip, .face, [role="button"], a, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .li, .iconbtn, .sendbtn, .addbtn, .fab, .face, .slotempty, nav.tabs button, .seg button, .ckseg button, .xbtn {
    transition: transform .16s cubic-bezier(.2, .8, .2, 1), background-color .2s ease, color .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active, .chip:active, .li:active, .iconbtn:active, .sendbtn:active, .addbtn:active, .fab:active, .face:active, .slotempty:active, .seg button:active, .ckseg button:active, .xbtn:active { transform: scale(.96); }
  nav.tabs button:active svg { transform: scale(.9); }
  nav.tabs button svg { transition: background-color .25s ease, transform .16s ease; }
  .view.enter { animation: viewIn .26s cubic-bezier(.2, .8, .2, 1); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.fresh { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
  .bar > i { transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .sheet-bg { animation: fadeIn .22s ease-out; }
  .sheet-bg .sheet { animation: sheetUp .3s cubic-bezier(.2, .8, .2, 1); }
  .sheet-bg.closing { animation: fadeOut .2s ease-in forwards; }
  .sheet-bg.closing .sheet { animation: sheetDown .2s ease-in forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes sheetDown { to { transform: translateY(40px); opacity: 0; } }
  .toast { animation: toastIn .25s cubic-bezier(.2, .8, .2, 1); }
  .toast.closing { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, 12px); } }
  .action { animation: rise .22s ease-out; }
  .proposal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ring .arc, .dial .arc { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
  .msg.assistant .bubble.thinking::after { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
}

.fab { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 18px; width: 58px; height: 58px; border-radius: 20px; border: 0; background: linear-gradient(135deg, #22c1a8, #0f9f8f); color: #fff; font-size: 30px; font-weight: 600; line-height: 1; box-shadow: 0 10px 24px rgba(15, 159, 143, .35); z-index: 5; }
#v-matvarer { padding-bottom: 96px; }
#v-matvarer .fab { position: fixed; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.av { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 17px; flex: none; }
.av.a1 { background: #dcf3ef; color: #0f8a7c; } .av.a2 { background: #fdf1dc; color: #b7791f; } .av.a3 { background: #e1f5ec; color: #2f9e74; } .av.a4 { background: #e4ecfc; color: #2f5bc4; } .av.a5 { background: #e8eef5; color: #4a6a8a; }
.ckrow { display: flex; align-items: center; gap: 10px; }
.ckl { width: 96px; font-weight: 700; font-size: 14px; color: var(--ink-2); flex: none; }
.ckseg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; }
.ckseg button { border: 0; background: var(--surface-2); border-radius: 10px; padding: 7px 0; font-family: var(--f-display); font-weight: 800; color: var(--ink-2); }
.ckseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
details ul li { margin-bottom: 4px; }
.wfgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wfgrid .field:last-child { grid-column: 1 / -1; }
.wfgrid .input { padding: 10px 10px; min-width: 0; }
.tggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.unitin { position: relative; }
.unitin .input { padding-right: 44px; font-family: var(--f-display); font-weight: 800; font-size: 17px; }
.unitin span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); font-weight: 700; pointer-events: none; }
[hidden] { display: none !important; }

/* ---------- Varm glass-stil: mørk espresso-bakgrunn med myke lyskilder, frostede kort, rav aksent ---------- */
body { letter-spacing: -.01em; background: var(--bg); color: var(--ink); }
body::after { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38% 28% at 85% 6%, rgba(244, 162, 97, .28), transparent 70%),
    radial-gradient(45% 35% at 8% 30%, rgba(120, 82, 54, .45), transparent 72%),
    radial-gradient(55% 40% at 70% 75%, rgba(92, 62, 42, .5), transparent 72%),
    radial-gradient(40% 30% at 15% 95%, rgba(244, 162, 97, .14), transparent 70%),
    linear-gradient(180deg, #1b1511 0%, #120e0b 55%, #0d0a08 100%); }
body::before { background: transparent; }
h1, h2, h3, .brand .bt, h2.vh, .hero .center .n, .face .big, .tile .v { letter-spacing: -.025em; }
.brand .bt { font-size: 30px; font-weight: 700; }
.brand small { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.brand .logo { border-radius: 13px !important; width: 40px; height: 40px; background: linear-gradient(150deg, #f7b77e, #e0823d) !important; box-shadow: 0 8px 22px rgba(244, 162, 97, .35) !important; }
.topbar { padding-block: 10px 8px; }
.iconbtn { background: var(--surface-2); color: var(--ink); width: 38px; height: 38px; border: 1px solid var(--glass-edge); box-shadow: none; }
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
.iconbtn svg { width: 19px; height: 19px; }
h2.vh { font-size: 28px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 650; }
.eyebrow { font-weight: 500; font-size: 12.5px; color: var(--ink-3); }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }

/* Glass-kort */
.face, .hero, .tile, .slot, .card, .tbl, .label, .chart, details, .proposal, .list, .gcard, .composer .row {
  background: var(--surface); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
}
.face, .hero, .gcard, .composer .row, nav.tabs { -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%); }
.face, .slot, .card, .tbl, .label, .chart, details, .gcard { border-radius: var(--r); }
.hero { border-radius: 30px; }
.tile { border-radius: 20px; }
.tile .k { font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.tile .t { color: var(--ink-3); }
/* Første flis i rav, som «Total revenue»-kortet */
.tiles .tile:first-child { background: linear-gradient(155deg, rgba(247, 183, 126, .55), rgba(170, 98, 46, .35)); border-color: rgba(255, 210, 170, .3); }
.tiles .tile:first-child .v { color: #fff; }
.tiles .tile:first-child .k, .tiles .tile:first-child .t { color: rgba(255, 245, 235, .8); }
.tiles .tile:first-child .bar { background: rgba(255, 255, 255, .22); }
.tiles .tile:first-child .bar > i { background: #fff; }
.list { gap: 0; border-radius: var(--r); overflow: hidden; }
.list .li { background: transparent; border: 0; border-radius: 0; box-shadow: inset 0 -1px 0 var(--rule); color: var(--ink); }
.list .li:last-child { box-shadow: none; }
button.li:hover { background: var(--surface-2); }
.li { background: var(--surface); border: 1px solid var(--glass-edge); color: var(--ink); }
.action { background: var(--surface-flat); border: 1px solid var(--glass-edge); box-shadow: none; color: var(--ink); }

/* Fanelinje og ark */
nav.tabs { margin: 0 12px max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px)); padding: 5px 6px; border-radius: 30px; background: rgba(28, 22, 18, .72); border: 1px solid var(--glass-edge); box-shadow: 0 14px 34px rgba(0, 0, 0, .45); }
nav.tabs button { color: var(--ink-3); font-weight: 500; font-size: 10px; padding: 6px 0 4px; border-radius: 24px; }
nav.tabs button svg { width: 26px; height: 26px; padding: 1px; border-radius: 0; stroke-width: 1.8; background: none; }
nav.tabs button[aria-current="page"] { color: var(--ink); background: rgba(255, 244, 232, .12); }
nav.tabs button[aria-current="page"] svg { background: none; color: var(--accent); }
.sheet { border-radius: 28px 28px 0 0; background: rgba(30, 24, 20, .86); -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%); border-top: 1px solid var(--glass-edge); color: var(--ink); }
.sheet::before { background: var(--ink-3); width: 36px; }
.sheet .input, .sheet select.input, .sheet textarea.input { background: var(--surface-2); }
.toast { border-radius: 18px; background: rgba(40, 32, 26, .92); color: var(--ink); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.toast button { color: var(--accent); }

/* Knapper, felt, segmenter: piller */
.btn { border-radius: 999px; box-shadow: none; background: var(--surface-2); border: 1px solid var(--glass-edge); font-weight: 600; color: var(--ink); }
.btn:hover { background: var(--surface-3); }
.btn.primary { background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); border-color: transparent; box-shadow: 0 8px 20px rgba(244, 162, 97, .3); }
.btn.primary:hover { background: linear-gradient(150deg, #f9c492, #f2a061); }
.btn.ghost { color: var(--accent); background: transparent; border-color: transparent; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip { background: var(--surface-2); color: var(--ink); border: 1px solid var(--glass-edge); font-weight: 500; border-radius: 999px; box-shadow: none; }
.input, select.input, textarea.input { border: 1px solid var(--glass-edge); background: var(--surface-2); border-radius: 14px; color: var(--ink); }
.input::placeholder { color: var(--ink-3); }
.input:focus { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
select.input option { background: #241d18; color: var(--ink); }
.field label { color: var(--ink-2); font-weight: 500; }
.seg { background: var(--surface-2); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 3px; }
.seg button { border-radius: 999px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: #fbf6f1; color: #1b1511; box-shadow: none; font-weight: 600; }
.ckseg button { background: var(--surface-2); color: var(--ink-2); }
.ckseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Chat */
.msg.user .bubble { background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); border-radius: 22px 22px 6px 22px; font-weight: 500; }
.msg.assistant .bubble { background: var(--bubble); border: 1px solid var(--glass-edge); box-shadow: none; border-radius: 22px 22px 22px 6px; color: var(--ink); }
.msg.assistant .who i { background: linear-gradient(150deg, #f7b77e, #e0823d); }
.msg.assistant .who { font-weight: 500; color: var(--ink-3); }
.bubble b { color: var(--ink); }
.composer .row { border-radius: 28px; }
.composer textarea { color: var(--ink); }
.composer .attach { background: var(--surface-2); color: var(--accent); border: 0; }
.sendbtn { background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); width: 40px; height: 40px; margin: 2px; }
.bubble .tablewrap, .bubble code { background: var(--surface-2); }
.notice { background: var(--warn-soft); color: var(--warn); }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }

/* I dag */
.datenav .d { color: var(--ink); font-weight: 650; }
.hero .center .n { font-weight: 700; }
.hero .legend { color: var(--ink-2); }
.addbtn { background: var(--accent-soft); color: var(--accent); }
.slotempty { border: 1px dashed var(--glass-edge); background: transparent; color: var(--ink-3); font-weight: 500; }
.slotempty:hover { color: var(--accent); border-color: var(--accent); }
.slot.isempty { background: var(--surface-flat); box-shadow: none; }
.slot .sd.frokost { background: var(--carbs); } .slot .sd.lunsj { background: var(--fiber); } .slot .sd.middag { background: var(--accent); } .slot .sd.kvelds { background: var(--protein); }
.meal header .mt { background: var(--accent-soft); color: var(--accent); }
.amt input { background: var(--surface-2); border-radius: 10px; color: var(--ink); }
.fab { border-radius: 50%; background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); box-shadow: 0 10px 24px rgba(244, 162, 97, .35); }
.av { border-radius: 13px; }
.av.a1 { background: var(--accent-soft); color: var(--accent); } .av.a2 { background: rgba(245, 211, 107, .15); color: var(--carbs); } .av.a3 { background: var(--ok-soft); color: var(--fiber); } .av.a4 { background: var(--protein-soft); color: var(--protein); } .av.a5 { background: rgba(255, 138, 112, .15); color: var(--fat); }
.pill { border-radius: 999px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); }
.pill.garmin { background: var(--accent-soft); color: var(--accent); }
.pill.etikett, .pill.bruker, .pill.bekreftet { background: var(--ok-soft); color: var(--ok); }
.pill.offentlig, .pill.produsent { background: var(--protein-soft); color: var(--protein); }
.pill.estimat, .pill.verify { background: var(--warn-soft); color: var(--warn); }
.ring .track { stroke: var(--track); }
.bar { background: var(--track); }
.bar > i { background: var(--accent); }
.face .sub b { color: var(--protein); }
.items td, .meal, .tbl td, .label .lrow, .label .lh { border-color: var(--rule); }
.items td { border-top: 1px solid var(--rule); }
.chart text { fill: var(--ink-3); }
.kv dt { color: var(--ink-3); }
a { color: var(--accent); }

/* Glass-diagrammer */
.gcard { padding: 16px 16px 14px; margin-top: 12px; position: relative; }
.gch { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.gt { font-weight: 650; font-size: 16px; }
.gs { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

}

/* Logo og intro */
.brand .logo { background: linear-gradient(160deg, #3a2a1f, #15100c) !important; border: 1px solid rgba(255, 220, 190, .16); box-shadow: 0 8px 22px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08) !important; }
.brand .logo svg { width: 30px; height: 30px; }
.splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; overflow: hidden; }
.splash::before { content: ""; position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.2); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(244, 162, 97, .35), rgba(244, 162, 97, .08) 45%, transparent 70%); opacity: 0; animation: spBloom 1.6s .1s cubic-bezier(.2, .8, .2, 1) forwards; }
.splogo { position: relative; width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: linear-gradient(160deg, #2c2018, #0e0a08); border: 1px solid rgba(255, 220, 190, .14);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .08); animation: spPop 1s cubic-bezier(.16, 1, .3, 1) both; }
.splogo svg { width: 84px; height: 84px; overflow: visible; }
.splash .lA { stroke-dasharray: 120; stroke-dashoffset: 120; animation: spDraw .9s .2s cubic-bezier(.65, 0, .25, 1) forwards; }
.splash .lB { stroke-dasharray: 70; stroke-dashoffset: 70; animation: spDraw .8s .35s cubic-bezier(.65, 0, .25, 1) forwards; }
.splash .lC { transform-origin: 50.5px 32px; transform: scale(0); animation: spSpark .45s .95s cubic-bezier(.2, .9, .3, 1.6) forwards; filter: drop-shadow(0 0 6px rgba(255, 200, 150, .9)); }
.spname { position: relative; font-size: 56px; font-weight: 700; letter-spacing: -.045em; line-height: 1;
  background: linear-gradient(100deg, #8a7a6d 0%, #fbf6f1 35%, #ffd8b0 50%, #fbf6f1 65%, #8a7a6d 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: spUp .9s .45s cubic-bezier(.16, 1, .3, 1) both, spSheen 1.4s .6s ease-out both; }
.sptag { position: relative; font-size: 15px; font-weight: 500; color: rgba(251, 246, 241, .55); letter-spacing: .02em; animation: spUp .9s .7s cubic-bezier(.16, 1, .3, 1) both; }
.splash.out { animation: spOut .5s cubic-bezier(.6, 0, .4, 1) forwards; }
@keyframes spBloom { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes spPop { from { transform: scale(.82); opacity: 0; filter: blur(8px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes spDraw { to { stroke-dashoffset: 0; } }
@keyframes spSpark { to { transform: scale(1); } }
@keyframes spUp { from { transform: translateY(18px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes spSheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes spOut { to { opacity: 0; transform: scale(1.04); visibility: hidden; } }

/* Kameraskanner */
.scanner { position: fixed; inset: 0; z-index: 90; background: #000; animation: fadeIn .2s ease-out; }
.scanner.closing { animation: fadeOut .2s ease-in forwards; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanframe { position: absolute; left: 10%; right: 10%; top: 50%; height: 26%; transform: translateY(-50%); border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); border: 2px solid rgba(255, 216, 176, .9); overflow: hidden; }
.scanframe i { position: absolute; left: 6%; right: 6%; height: 2px; top: 50%; background: linear-gradient(90deg, transparent, #ffd8b0, transparent); box-shadow: 0 0 12px #f4a261; animation: scanLine 1.6s ease-in-out infinite; }
.scanner.hit .scanframe { border-color: #6fdc9a; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55), 0 0 30px rgba(111, 220, 154, .6); }
@keyframes scanLine { 0%, 100% { transform: translateY(-36px); } 50% { transform: translateY(36px); } }
.scantop { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
.scanbot { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; }

.pgwk-h b { font-size: 15px; }
.pgwk-h span { font-size: 12px; color: var(--ink-3); }
.pgwk-g { display: grid; grid-template-columns: 1.1fr 1.2fr 1fr .7fr; gap: 6px; }
.pgwk-g > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pgwk-g span { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.pgwk-g b { font-size: 16px; font-variant-numeric: tabular-nums; }
.pgwk-g b small { font-size: 11px; color: var(--ink-3); }
.pgwk-g em { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pgwk-g em.up { color: #ffb39f; } .pgwk-g em.down { color: #9ff0bd; }

/* ---------- Ryddigere styrkelogg ---------- */
.logger { margin-top: 4px; }
.lghead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lgdate { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--glass-edge); font-weight: 650; font-size: 15px; }
.lgdate::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translateY(-2px); }
.lgdate input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer; }
.voltoggle { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px 7px 8px; border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--surface-2); color: var(--ink-2); font: inherit; font-weight: 650; font-size: 14.5px; }
.voltoggle i { width: 34px; height: 20px; border-radius: 999px; background: rgba(255, 244, 232, .16); position: relative; transition: background .2s ease; }
.voltoggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
.voltoggle.on { color: var(--ink); border-color: rgba(244, 162, 97, .45); }
.voltoggle.on i { background: linear-gradient(150deg, #f7b77e, #ee9550); }
.voltoggle.on i::after { transform: translateX(14px); }
.trfoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.trfoot .btn { color: var(--ink-2); }
.trfoot .btn:last-child { color: var(--accent); }
.fftabs, .scanmode { display: flex; width: 100%; }
.fftabs button, .scanmode button { flex: 1; padding: 9px 6px; }

/* Skanneren står fast i stående format */
.scanner.rot { inset: auto; left: 50%; top: 50%; width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); }

/* ---------- Liquid Glass ----------
   Frostet, lysbrytende glass over varme lyskilder: sterkere uskarphet og metning, en lys kant øverst til venstre
   som fanger lyset, mørk kant nederst, og myke skygger. */
body::after {
  background:
    radial-gradient(42% 30% at 88% 4%, rgba(255, 178, 110, .38), transparent 70%),
    radial-gradient(40% 32% at 6% 26%, rgba(196, 128, 78, .42), transparent 72%),
    radial-gradient(50% 36% at 76% 58%, rgba(150, 96, 60, .5), transparent 72%),
    radial-gradient(46% 34% at 18% 82%, rgba(244, 162, 97, .24), transparent 70%),
    radial-gradient(30% 22% at 55% 30%, rgba(255, 220, 180, .10), transparent 70%),
    linear-gradient(180deg, #1f1712 0%, #140f0c 55%, #0e0a08 100%);
}
:root {
  --lg-fill: linear-gradient(145deg, rgba(255, 249, 242, .16) 0%, rgba(255, 249, 242, .06) 38%, rgba(255, 249, 242, .035) 62%, rgba(255, 249, 242, .09) 100%);
  --lg-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(0, 0, 0, .28), inset 1px 0 0 rgba(255, 255, 255, .05), 0 20px 44px -14px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .18);
  --lg-edge: rgba(255, 240, 225, .17);
}
.hero, .gcard, .tile, .card, .list, .tbl, .chart, details, .slot, .pgwk, .exrow, .li:not(.list .li), .face, .label, .tsbig, .lgtot > div, .rbtot > div, .pgmini > div, .pggoal {
  background: var(--lg-fill); border-color: var(--lg-edge); box-shadow: var(--lg-shadow);
}
.hero, .gcard, .tile, .tsbig, .pgwk, nav.tabs, .sheet, .exart {
  -webkit-backdrop-filter: blur(28px) saturate(175%) brightness(1.04); backdrop-filter: blur(28px) saturate(175%) brightness(1.04);
}
/* Lysende kant: gradient-ramme som bare tegnes i kanten (som lys som brytes i glasset) */
.hero, .gcard, nav.tabs, .tsbig, .exart { position: relative; isolation: isolate; }
.hero::after, .gcard::after, nav.tabs::after, .tsbig::after, .exart::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(140deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .12) 22%, rgba(255, 255, 255, 0) 45%, rgba(255, 255, 255, 0) 60%, rgba(255, 220, 190, .14) 80%, rgba(255, 255, 255, .32) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
/* Fremhevede flater i rav beholder fargen, men får glassglans */
.tiles .tile:first-child, .tsbig, .cbig:not(.alt), .onkcal, .rbtot > div.per, .lgtot > div:first-child {
  background: linear-gradient(150deg, rgba(255, 196, 140, .55) 0%, rgba(214, 128, 66, .38) 45%, rgba(150, 82, 38, .32) 100%);
  border-color: rgba(255, 214, 178, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -1px 0 rgba(0, 0, 0, .2), 0 18px 40px -12px rgba(160, 80, 20, .55);
}
/* Fanelinjen: flytende glasskapsel, valgt fane som en lysende linse */
nav.tabs { background: linear-gradient(160deg, rgba(60, 46, 36, .55), rgba(28, 21, 17, .5)); border-color: rgba(255, 240, 225, .16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 18px 40px rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); }
nav.tabs button[aria-current="page"] { background: radial-gradient(120% 140% at 30% 0%, rgba(255, 255, 255, .26), rgba(255, 255, 255, .07) 60%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -1px 0 rgba(0, 0, 0, .2), 0 4px 14px rgba(0, 0, 0, .25); }
/* Ark: frostet glass */
.sheet { background: linear-gradient(170deg, rgba(58, 44, 34, .78), rgba(26, 20, 16, .86)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 -20px 50px rgba(0, 0, 0, .45); }
/* Knapper og valg med glass */
.btn:not(.primary):not(.ghost):not(.danger) { background: linear-gradient(160deg, rgba(255, 249, 242, .14), rgba(255, 249, 242, .05)); border: 1px solid var(--lg-edge); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
.btn.primary { background: linear-gradient(160deg, #ffc896 0%, #f4a261 45%, #e08a45 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -2px 0 rgba(120, 60, 20, .25), 0 10px 26px -6px rgba(244, 162, 97, .55); }
.seg { background: linear-gradient(160deg, rgba(255, 249, 242, .1), rgba(255, 249, 242, .04)); border: 1px solid var(--lg-edge); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
.seg button[aria-pressed="true"] { background: radial-gradient(120% 160% at 30% 0%, #fff, #f3ece6 70%); color: #1b140f; box-shadow: 0 2px 10px rgba(0, 0, 0, .3), inset 0 -1px 0 rgba(0, 0, 0, .08); }
.iconbtn { background: linear-gradient(160deg, rgba(255, 249, 242, .16), rgba(255, 249, 242, .05)); border: 1px solid var(--lg-edge); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 16px rgba(0, 0, 0, .3); }
.input, select.input, textarea.input, .cselect { background: rgba(255, 249, 242, .07); border-color: rgba(255, 240, 225, .12); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }
.expchip, .splitbtn, .chiptoggle, .voltoggle, .lgdate, .xpgroups button, .pgchip { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
.splitbtn.on { background: linear-gradient(160deg, #ffc896, #ee9550); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 8px 18px -4px rgba(244, 162, 97, .5); }
.trtype { display: flex; width: 100%; margin: 10px 0 2px; }
.trtype button { flex: 1; padding: 10px 6px; font-size: 14.5px; }
.trtype b { font-weight: 400; margin-right: 4px; }
.trfoot { justify-content: flex-end; }
.cdico { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--surface-2); border: 1px solid var(--glass-edge); }
.cdtypes { flex-wrap: wrap; overflow: visible; }
.cdtypes .splitbtn { padding: 8px 13px; font-size: 14px; }
.cdint { display: flex; width: 100%; }
.cdint button { flex: 1; }
button.gcol { background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
button.gcol:active .gbar { transform: scaleY(.96); transform-origin: bottom; }
.lgvolbox b { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  .lgvolbox.bump { animation: volBump 1.1s cubic-bezier(.2, .8, .2, 1); }
  .lgvolbox.bump b { animation: volGlow 1.1s ease-out; }
  @keyframes volBump { 0% { transform: scale(1); } 18% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes volGlow { 0% { text-shadow: 0 0 0 rgba(255, 220, 180, 0); } 25% { text-shadow: 0 0 18px rgba(255, 220, 180, .85); } 100% { text-shadow: 0 0 0 rgba(255, 220, 180, 0); } }
}
.danger-text { color: #ff9a8a !important; justify-content: center; }

/* Muskelkart med belastning */
.mmscope { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; }
.mmscope::-webkit-scrollbar { display: none; }
.mmscope .expchip { flex: none; }
.musmap { padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-top: 0; }
.musmap.compact { padding: 12px; }
.mmfig { position: relative; border-radius: 18px; padding: 14px 10px 6px; background: radial-gradient(90% 80% at 50% 20%, rgba(255, 236, 214, .10), rgba(0, 0, 0, .12)); }
.mmfig svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; height: auto; }
.musmap.compact .mmfig svg { max-width: 280px; }

.mmfig polygon.mz { cursor: pointer; }

.mmlbl { display: flex; justify-content: space-around; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.mmscale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.mmscale i { flex: 1; height: 8px; border-radius: 999px; background: linear-gradient(90deg, #fff, rgb(255, 226, 196), rgb(255, 196, 140), rgb(244, 162, 97), rgb(232, 104, 58), rgb(201, 55, 44)); }
.mmrank { display: flex; flex-direction: column; gap: 4px; }
.mmrow { display: grid; grid-template-columns: 12px 120px 1fr auto; gap: 10px; align-items: center; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; padding: 7px 4px; border-radius: 10px; cursor: pointer; }
.mmrow:active { background: var(--surface-2); }
.mmrow .mmn { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmrow .mmb { height: 8px; border-radius: 999px; background: rgba(255, 244, 232, .08); overflow: hidden; }
.mmrow .mmb i { display: block; height: 100%; border-radius: inherit; }
.mmrow b { font-variant-numeric: tabular-nums; font-size: 14.5px; }
.mmrow b small, .mmchips small { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-left: 2px; }
.mmdot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2); }
.mmsel { display: flex; flex-direction: column; gap: 10px; }
.mmselh { display: flex; align-items: center; gap: 10px; }
.mmselh b { font-size: 19px; flex: 1; }
.mmstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mmstats > div { background: var(--surface-2); border: 1px solid var(--glass-edge); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; }
.mmstats b { font-size: 18px; font-variant-numeric: tabular-nums; }
.mmstats span { font-size: 11.5px; color: var(--ink-3); }
.mmchips { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--ink-2); }
.mmchips span { display: inline-flex; align-items: center; gap: 6px; }
.mmchips i { width: 10px; height: 10px; border-radius: 3px; }
.ci { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cdico { color: var(--accent); }
.cdico .ci { width: 23px; height: 23px; }
.trtype button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.trtype .ci { width: 19px; height: 19px; }
.cdtypes .splitbtn { display: inline-flex; align-items: center; gap: 6px; }
.cdtypes .ci { width: 17px; height: 17px; }
.pgstats > h3 { margin-bottom: 10px; }
.mmlabel { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 4px 2px 6px; }
.mmmus { padding: 0 0 2px; }
.mmpill { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--glass-edge); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.mmpill i { width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.mmpill.cold { color: var(--ink-3); }
.mmpill.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* Muskelfiguren: myk, sammenhengende kropp med lysende muskler */
.mmfig { padding: 18px 8px 8px; background: radial-gradient(70% 60% at 50% 30%, rgba(255, 230, 205, .16), rgba(255, 230, 205, 0) 70%), radial-gradient(120% 90% at 50% 100%, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0)); }
.mmfig svg { max-width: 380px; overflow: visible; }
.mmfloor { fill: url(#mmFloor); }
.mmbase polygon { fill: #efe9e3; stroke: #efe9e3; stroke-width: 2.4; stroke-linejoin: round; }
.mmheat polygon { stroke-width: .9; stroke-linejoin: round; }
.mmline polygon { fill: none; stroke: rgba(70, 46, 32, .28); stroke-width: .42; stroke-linejoin: round; }
.mmgloss polygon { fill: url(#mmGloss); stroke: none; mix-blend-mode: soft-light; }
.mmhit polygon { fill: transparent; stroke: transparent; cursor: pointer; }
.mmhit polygon.sel { stroke: #fff; stroke-width: 1.3; stroke-linejoin: round; filter: drop-shadow(0 0 2.5px rgba(255, 210, 160, .95)); }
.mmfig svg > g > .mmbase { filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .45)); }
.mmheat { filter: drop-shadow(0 0 2px rgba(244, 120, 60, .55)); }
@media (prefers-reduced-motion: no-preference) {
  .mmheat { animation: mmIn .6s cubic-bezier(.2, .8, .2, 1); }
  .mmhit polygon.sel { animation: mmPulse 1.6s ease-in-out infinite; }
  @keyframes mmIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mmPulse { 50% { stroke-opacity: .35; } }
}
.mmfig polygon { transition: none; }
.mmscope .expchip.dim b { color: var(--ink-3); }
.mmsess .expchip { padding: 6px 11px; }
.mmsess .expchip b { font-size: 13px; }
.pgtop .trper { margin-bottom: 10px; }
.mmsection .musmap { margin-top: 2px; }

/* ---------- Loggfør mat v2: søk, mengde-ark og eget tall-tastatur ---------- */
/* Arkene følger det synlige området, så tastaturet aldri dekker innholdet. */
.sheet-bg { top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); }
html.kb .sheet { padding-bottom: 12px; max-height: 96%; }
.sheet.tall { max-height: calc(100% - 6px - env(safe-area-inset-top, 0px)); }
.sheet.tall .sh { padding-bottom: 6px; }
.sheet.tall .sh h2 { font-size: 20px; }

.ffbar { display: flex; gap: 8px; align-items: stretch; }
.ffsearch { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 13px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--glass-edge); transition: border-color .15s, box-shadow .15s; }
.ffsearch:focus-within { border-color: rgba(244, 162, 97, .55); box-shadow: 0 0 0 3px rgba(244, 162, 97, .14); }
.ffsearch svg { width: 19px; height: 19px; flex: none; fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; }
.ffsearch input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16.5px; padding: 13px 0; outline: none; -webkit-appearance: none; appearance: none; }
.ffsearch input::-webkit-search-cancel-button { display: none; }
.ffsearch input::placeholder { color: var(--ink-3); }
.ffclear { border: 0; background: var(--surface-3, rgba(255,255,255,.12)); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; padding: 0; }
.ffclear svg { width: 13px; height: 13px; stroke: var(--ink-2); stroke-width: 2.6; }
.ffscan { border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; flex: none; border-radius: 16px; background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); font-weight: 650; font-size: 11.5px; box-shadow: 0 8px 20px rgba(244, 162, 97, .25); }
.ffscan svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.ffscan[hidden] { display: none; }
.fhead { display: flex; align-items: baseline; gap: 8px; }
.fhead em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; color: var(--ink-3); opacity: .8; }
.ffmore { display: block; width: 100%; margin-top: 6px; border: 0; background: transparent; color: var(--accent); font-weight: 650; font-size: 14.5px; padding: 8px; border-radius: 12px; }
.ffload { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-3); margin: 12px 4px 4px; }
.ffload i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--glass-edge); border-top-color: var(--accent); animation: ffspin .8s linear infinite; }
@keyframes ffspin { to { transform: rotate(360deg); } }
.ffnone { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px dashed var(--glass-edge); margin-top: 8px; }
.ffnone span { font-size: 13.5px; color: var(--ink-2); }
.fli .t1 { font-size: 15.5px; }
.fli .kc { font-size: 17px; }
.fli .kc small { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fli.busy { opacity: .55; }
.av.pic { position: relative; overflow: hidden; background: #fbf6f1; color: #8a6a50; }
.av.pic img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: contain; border-radius: 9px; background: #fbf6f1; }

/* Mengde-ark */
.addsheet { display: flex; flex-direction: column; gap: 10px; }
.afhead { display: flex; align-items: center; gap: 11px; }
.afhead .grow { flex: 1; min-width: 0; }
.afname { font-size: 19px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.afsub { font-size: 13px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.afsrc { font-size: 12.5px; color: var(--ink-3); margin-top: -4px; }
.afcard { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--glass-edge); min-height: 78px; }
.afamtv { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 2px; border: 0; background: transparent; color: var(--ink); padding: 4px 6px; margin-left: -6px; border-radius: 12px; text-align: left; }
.afamtv b { font-size: 44px; font-weight: 800; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; padding: 0 2px; border-radius: 8px; transition: background .12s; }
.afamtv span { font-size: 18px; font-weight: 650; color: var(--ink-2); margin-left: 6px; }
.afamtv.fresh b, .stkw.fresh b { background: rgba(244, 162, 97, .28); }
.caret { display: inline-block; width: 2.5px; height: 34px; background: var(--accent); border-radius: 2px; align-self: center; margin-left: 1px; animation: caret 1.05s steps(1) infinite; }
.afamtv.fresh .caret, .stkw.fresh .caret { display: none; }
@keyframes caret { 50% { opacity: 0; } }
.afresr { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.afkc { font-size: 15px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.afkc b { font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.afresr .afm { display: flex; gap: 9px; font-size: 12.5px; color: var(--ink-2); justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; }
.afresr .afm .dot { width: 7px; height: 7px; margin-right: 4px; }
.afeq { font-size: 12px; color: var(--ink-3); }

<script>
/* Coach som egen app: gir appen det samme «claude.use()»-grensesnittet som i Claude, men med Supabase som database
 * og innlogging. Ingen AI: «sample» og «mcp» finnes ikke her, så appen bruker sitt eget skrivefelt og egne oppslag. */
(function () {
  'use strict';
  var CFG = window.COACH_CONFIG || {};
  var sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'coach-auth', storage: window.localStorage } });
  window.coachSupabase = sb;

  /* ---------- Dokumentlager over tabellen docs (col, id, data) ---------- */
  var cache = {};       // col -> Map(id -> data)
  var loaded = {};      // col -> Promise
  var listeners = {};   // col -> [fn]
  var docListeners = {}; // path -> [fn]
  var userId = null;

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function mapOf(col) { return cache[col] || (cache[col] = new Map()); }
  function err(e) { var x = new Error((e && e.message) || 'Databasefeil'); x.code = e && e.code === '42501' ? 'not_granted' : 'unknown'; return x; }

  async function fetchCol(col) {
    var all = [], from = 0, page = 1000;
    for (;;) {
      var r = await sb.from('docs').select('id,data').eq('col', col).range(from, from + page - 1);
      if (r.error) throw err(r.error);
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) break;
      from += page;
    }
    var m = new Map(); all.forEach(function (row) { m.set(row.id, row.data); });
    cache[col] = m;
    return m;
  }
  function ensure(col) { return loaded[col] || (loaded[col] = fetchCol(col).catch(function (e) { delete loaded[col]; throw e; })); }
  function snapDoc(col, id) {
    var m = mapOf(col), has = m.has(id);
    return { id: id, exists: has, data: function () { return has ? clone(m.get(id)) : undefined; }, metadata: { fromCache: false } };
  }
  function notify(col, id) {
    (listeners[col] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
    (docListeners[col + '/' + id] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
  }
  function notifyAll(col) {
    (listeners[col] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
    Object.keys(docListeners).forEach(function (p) { if (p.indexOf(col + '/') === 0) docListeners[p].forEach(function (f) { try { f(); } catch (e) {} }); });
  }

  function query(col, ord, lim) {
    function build() {
      var docs = Array.from(mapOf(col).keys()).map(function (id) { return snapDoc(col, id); });
      if (ord) docs.sort(function (a, b) { var x = a.data()[ord.f], y = b.data()[ord.f]; return (x < y ? -1 : x > y ? 1 : 0) * (ord.d === 'desc' ? -1 : 1); });
      if (lim) docs = docs.slice(0, lim);
      return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: { fromCache: false } };
    }
    return {
      orderBy: function (f, d) { return query(col, { f: f, d: d || 'asc' }, lim); },
      limit: function (n) { return query(col, ord, n); },
      where: function () { return query(col, ord, lim); },
      doc: function (id) { return doc(col + '/' + id); },
      get: async function () { await fetchCol(col); loaded[col] = Promise.resolve(cache[col]); return build(); },
      onSnapshot: function (next, onErr) {
        var f = function () { next(build()); };
        (listeners[col] = listeners[col] || []).push(f);
        ensure(col).then(f, function (e) { if (onErr) onErr(err(e)); });
        return function () { listeners[col] = (listeners[col] || []).filter(function (x) { return x !== f; }); };
      }
    };
  }
  function doc(path) {
    var parts = path.split('/'), col = parts[0], id = parts.slice(1).join('/');
    return {
      get: async function () {
        var r = await sb.from('docs').select('data').eq('col', col).eq('id', id).maybeSingle();
        if (r.error) throw err(r.error);
        if (r.data) mapOf(col).set(id, r.data.data); else mapOf(col).delete(id);
        return snapDoc(col, id);
      },
      set: async function (obj) {
        var data = clone(obj);
        var r = await sb.from('docs').upsert({ user_id: userId, col: col, id: id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'user_id,col,id' });
        if (r.error) throw err(r.error);
        mapOf(col).set(id, data); notify(col, id);
      },
      delete: async function () {
        var r = await sb.from('docs').delete().eq('col', col).eq('id', id);
        if (r.error) throw err(r.error);
        mapOf(col).delete(id); notify(col, id);
      },
      onSnapshot: function (next, onErr) {
        var f = function () { next(snapDoc(col, id)); };
        (docListeners[path] = docListeners[path] || []).push(f);
        ensure(col).then(f, function (e) { if (onErr) onErr(err(e)); });
        return function () { docListeners[path] = (docListeners[path] || []).filter(function (x) { return x !== f; }); };
      }
    };
  }
  var db = { doc: doc, collection: function (c) { return query(c); } };

  /* Endringer fra andre steder (Garmin-synken, en annen enhet): hent samlingen på nytt. */
  var pending = {};
  function refreshCol(col) {
    if (pending[col]) return; pending[col] = setTimeout(function () {
      delete pending[col];
      if (!listeners[col] && !Object.keys(docListeners).some(function (p) { return p.indexOf(col + '/') === 0; })) return;
      fetchCol(col).then(function () { notifyAll(col); }, function () {});
    }, 300);
  }
  function startRealtime() {
    try {
      sb.channel('docs-' + userId).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + userId }, function (p) {
        var col = (p.new && p.new.col) || (p.old && p.old.col); if (col) refreshCol(col); else Object.keys(listeners).forEach(refreshCol);
      }).subscribe();
    } catch (e) { /* sanntid er bonus */ }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') Object.keys(cache).forEach(refreshCol); });
  }

  /* ---------- Innlogging ---------- */
  var dbReady, resolveDb;
  dbReady = new Promise(function (r) { resolveDb = r; });

  function loginHtml(mode, msg) {
    var su = mode === 'signup';
    return '<div class="authwrap"><div class="authcard">' +
      '<div class="authlogo">' + (window.COACH_LOGO_SVG || '') + '</div>' +
      '<h1>Coach</h1><p class="authsub">' + (su ? 'Lag bruker. Dataene dine er bare dine.' : 'Logg inn for å fortsette.') + '</p>' +
      '<form id="authForm" novalidate><input class="input" id="authEmail" type="email" autocomplete="email" placeholder="E-post" required>' +
      '<input class="input" id="authPw" type="password" autocomplete="' + (su ? 'new-password' : 'current-password') + '" placeholder="Passord' + (su ? ' (minst 8 tegn)' : '') + '" required>' +
      '<div id="authMsg">' + (msg || '') + '</div>' +
      '<button class="btn primary" type="submit">' + (su ? 'Lag bruker' : 'Logg inn') + '</button></form>' +
      '<button class="btn ghost" id="authSwitch" type="button">' + (su ? 'Har du bruker? Logg inn' : 'Ny her? Lag bruker') + '</button>' +
      (su ? '' : '<button class="btn ghost small" id="authForgot" type="button">Glemt passord</button>') +
      '</div></div>';
  }
  function showLogin(mode, msg) {
    var host = document.getElementById('authHost');
    if (!host) { host = document.createElement('div'); host.id = 'authHost'; document.body.appendChild(host); }
    host.innerHTML = loginHtml(mode, msg);
    var form = document.getElementById('authForm');
    form.onsubmit = async function (e) {
      e.preventDefault();
      var email = document.getElementById('authEmail').value.trim(), pw = document.getElementById('authPw').value;
      var box = document.getElementById('authMsg'), btn = form.querySelector('button[type=submit]');
      if (!email || !pw) { box.innerHTML = '<div class="notice bad">Fyll inn e-post og passord.</div>'; return; }
      btn.disabled = true;
      try {
        if (mode === 'signup') {
          if (pw.length < 8) throw new Error('Passordet må ha minst 8 tegn.');
          var s = await sb.auth.signUp({ email: email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
          if (s.error) throw s.error;
          if (!s.data.session) { showLogin('login', '<div class="notice info">Sjekk e-posten din og trykk på bekreftelseslenken. Logg så inn her.</div>'); return; }
        } else {
          var l = await sb.auth.signInWithPassword({ email: email, password: pw });
          if (l.error) throw l.error;
        }
      } catch (er) {
        var m = String(er.message || er);
        if (/Invalid login/i.test(m)) m = 'Feil e-post eller passord.';
        if (/not confirmed/i.test(m)) m = 'E-posten er ikke bekreftet ennå. Sjekk innboksen.';
        if (/already registered/i.test(m)) m = 'Det finnes allerede en bruker med denne e-posten.';
        box.innerHTML = '<div class="notice bad">' + m.replace(/</g, '&lt;') + '</div>';
        btn.disabled = false;
      }
    };
    document.getElementById('authSwitch').onclick = function () { showLogin(mode === 'signup' ? 'login' : 'signup'); };
    var fg = document.getElementById('authForgot');
    if (fg) fg.onclick = async function () {
      var email = document.getElementById('authEmail').value.trim(), box = document.getElementById('authMsg');
      if (!email) { box.innerHTML = '<div class="notice bad">Skriv inn e-posten din først.</div>'; return; }
      var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      box.innerHTML = r.error ? '<div class="notice bad">' + r.error.message + '</div>' : '<div class="notice info">Sjekk e-posten for lenke til nytt passord.</div>';
    };
  }
  function hideLogin() { var h = document.getElementById('authHost'); if (h) h.remove(); }

  var started = false;
  function onSession(session) {
    if (!session) { showLogin('login'); return; }
    hideLogin();
    if (started) { if (session.user.id !== userId) location.reload(); return; }
    started = true; userId = session.user.id; window.coachEmail = session.user.email || '';
    startRealtime();
    resolveDb(db);
  }
  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === 'PASSWORD_RECOVERY') {
      var pw = prompt('Nytt passord (minst 8 tegn):');
      if (pw && pw.length >= 8) sb.auth.updateUser({ password: pw }).then(function (r) { alert(r.error ? r.error.message : 'Passordet er endret.'); });
    }
    if (ev === 'SIGNED_OUT') { location.reload(); return; }
    onSession(session);
  });
  sb.auth.getSession().then(function (r) { onSession(r.data && r.data.session); });

  /* ---------- claude.use()-grensesnittet ---------- */
  var downloads = {
    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([typeof o.data === 'string' ? o.data : JSON.stringify(o.data)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename || 'coach.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return { ok: true };
    }
  };
  var user = {
    isOwner: function () { return true; }, canEdit: function () { return true; }, can: function () { return true; },
    id: async function () { return userId; }, me: async function () { return { id: userId }; }, profiles: async function () { return {}; }
  };
  window.COACH_STANDALONE = true;
  window.coachSignOut = function () { return sb.auth.signOut(); };
  window.claude = {
    use: function (name) {
      if (name === 'db') return dbReady;
      if (name === 'user') return dbReady.then(function () { return user; });
      if (name === 'downloads') return Promise.resolve(downloads);
      return Promise.resolve(null);
    }
  };
})();

  async function weekSummary(ctx, endDate, nDays) {
