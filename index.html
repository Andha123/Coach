<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach</title>
<meta name="description" content="Coach – mat, trening og fremgang.">
<meta name="theme-color" content="#120e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html { height: 100%; background: #120e0b; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; height: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; }
/* Hele skjermen, også under statuslinjen og hjem-streken på iPhone */
#root { position: fixed; inset: 0; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
/* Layout: én kolonne, mobil først, i Apples formspråk: systemfont, grå grupperte flater med hvite kort,
   systemfarger (blå handlinger, grønn energi, indigo protein, oransje karbo, gul fett, turkis fiber), gjennomsiktig fanelinje. */
:root {
  color-scheme: dark;
  --bg: #120e0b;
  --surface: linear-gradient(160deg, rgba(255, 244, 232, .11), rgba(255, 244, 232, .035));
  --surface-flat: rgba(255, 244, 232, .07);
  --surface-solid: #241d18;
  --surface-2: rgba(255, 244, 232, .07);
  --surface-3: rgba(255, 244, 232, .12);
  --glass: rgba(34, 27, 22, .55);
  --glass-edge: rgba(255, 236, 214, .12);
  --ink: #fbf6f1;
  --ink-2: rgba(251, 246, 241, .66);
  --ink-3: rgba(251, 246, 241, .42);
  --rule: rgba(255, 236, 214, .09);
  --accent: #f4a261;
  --accent-2: #f7b77e;
  --accent-ink: #2a1708;
  --accent-soft: rgba(244, 162, 97, .16);
  --energy: #f4a261;
  --protein: #7cc4ff;
  --protein-soft: rgba(124, 196, 255, .16);
  --carbs: #f5d36b;
  --fat: #ff8a70;
  --fiber: #6fdc9a;
  --ok: #6fdc9a;
  --ok-soft: rgba(111, 220, 154, .16);
  --warn: #ffb35c;
  --warn-soft: rgba(255, 179, 92, .15);
  --bad: #ff6b5e;
  --bad-soft: rgba(255, 107, 94, .16);
  --bubble: rgba(255, 244, 232, .09);
  --track: rgba(255, 244, 232, .09);
  --shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
  --scrim: rgba(0, 0, 0, .5);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --r: 24px;
  --r-sm: 14px;
}

#root { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding-block: 10px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo svg { width: 26px; height: 26px; }
.brand .logo { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #22c1a8, #0f9f8f 55%, #2f6fd6) !important; box-shadow: 0 6px 16px rgba(15, 159, 143, .3); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
.brand .bt { font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: -.02em; line-height: 1.05; }
.brand small { display: block; font-family: var(--f-body); font-size: 12.5px; color: var(--ink-2); letter-spacing: 0; font-weight: 600; }
.topbar .spacer { flex: 1; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:hover { color: var(--ink); background: var(--surface-3); }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 28px; }
.view.chatview { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }

nav.tabs {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border-top: 1px solid var(--rule); box-shadow: 0 -6px 20px rgba(25, 40, 60, .05);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs button { background: none; border: 0; padding: 7px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: 0; min-width: 0; position: relative; }
nav.tabs button svg { width: 52px; height: 30px; padding: 4px 14px; border-radius: 15px; box-sizing: border-box; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] svg { background: var(--accent-soft); }
nav.tabs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h2.vh { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
h3 { font-size: 17px; font-weight: 800; color: var(--ink); }
.eyebrow { font-size: 12.5px; color: var(--ink-3); font-weight: 800; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 12px; padding-block: 16px; }

/* Knapper og felter */
.btn { border: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--surface-3) inset; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px rgba(15, 159, 143, .3); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; }
.btn.danger { color: var(--bad); background: var(--bad-soft); box-shadow: none; }
.btn.sm { padding: 7px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.input, select.input, textarea.input {
  border: 1px solid var(--surface-3); background: var(--surface); border-radius: var(--r-sm); padding: 11px 13px; width: 100%; min-width: 0; color: var(--ink);
}
.input:focus { border-color: var(--accent); outline: none; }
.input::placeholder { color: var(--ink-3); }
textarea.input { resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }

/* Statusmerker */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.etikett, .pill.bruker, .pill.bekreftet { background: var(--ok-soft); color: var(--ok); }
.pill.offentlig, .pill.produsent { background: var(--protein-soft); color: var(--protein); }
.pill.estimat, .pill.verify { background: var(--warn-soft); color: var(--warn); }
.pill.foreslått { background: transparent; color: var(--ink-2); border: 1px dashed var(--ink-3); }
.pill.garmin { background: var(--accent-soft); color: var(--accent); }

/* Urskive (ringer) */
.ring svg { display: block; }
.ring .track { stroke: var(--surface-3); }
.face { display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); cursor: pointer; margin-bottom: 8px; }
.face .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.face .big { font-family: var(--f-display); font-weight: 900; font-size: 32px; line-height: .95; font-variant-numeric: tabular-nums; }
.face .big small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: .02em; }
.face .sub { font-size: 13px; color: var(--ink-2); }
.face .sub b { color: var(--protein); font-family: var(--f-display); font-size: 15px; }
.macrobar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macrobar .m { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.macrobar .m span { font-size: 12px; color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.macrobar .m b { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.protein > i { background: var(--protein); }
.bar.carbs > i { background: var(--carbs); }
.bar.fat > i { background: var(--fat); }
.bar.fiber > i { background: var(--fiber); }
.bar.over > i { background: var(--warn); }

/* Chat */
.messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-block: 8px 14px; }
.msg { max-width: 94%; display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-self: flex-end; align-items: flex-end; max-width: 86%; }
.msg .bubble { line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); padding: 10px 15px; border-radius: 20px 20px 6px 20px; white-space: pre-wrap; font-weight: 600; }
.msg.assistant .bubble { padding: 12px 15px; background: var(--surface); border-radius: 20px 20px 20px 6px; box-shadow: var(--shadow); }
.msg.assistant .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--ink-2); }
.msg.assistant .who i { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--fat)); display: inline-block; }
.msg.assistant .bubble.thinking { color: var(--ink-3); }
.msg.assistant .bubble.thinking::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 8px; vertical-align: middle; }
.msg .meta { font-size: 11.5px; color: var(--ink-3); }
.msg .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.msg .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 14px; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
.bubble h4 { font-family: var(--f-display); font-size: 16px; font-weight: 800; margin: 10px 0 4px; }
.bubble b { color: var(--ink); }
.bubble .tablewrap { overflow-x: auto; margin: 8px 0; background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; }
.bubble table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
.bubble th { font-size: 12px; color: var(--ink-3); font-weight: 800; }
.bubble th, .bubble td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--rule); text-align: left; }
.bubble tr:last-child td { border-bottom: 0; }
.bubble code { background: var(--surface-2); padding: 0 5px; border-radius: 5px; font-size: 14px; }
.actions { display: flex; flex-direction: column; gap: 4px; }
.actions:empty { display: none; }
.action { font-size: 14px; display: flex; gap: 8px; align-items: flex-start; color: var(--ink); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; box-shadow: var(--shadow); }
.action .mk { font-weight: 800; flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; margin-top: 1px; }
.action.ok .mk { background: var(--ok-soft); color: var(--ok); }
.action.fail .mk { background: var(--bad-soft); color: var(--bad); }
.action.pend .mk { background: var(--surface-3); color: var(--ink-2); }

.proposal { border: 1.5px solid var(--accent); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; max-width: 440px; }
.proposal.saved { border-color: var(--ok); }
.proposal.rejected { opacity: .55; border-color: var(--rule); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.composer { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 12px; }
.composer .row { flex-wrap: nowrap; align-items: flex-end; gap: 8px; background: var(--surface); box-shadow: var(--shadow); border-radius: 26px; padding: 5px; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 150px; border: 0; background: transparent; padding: 10px 6px; line-height: 1.4; font-size: 16px; }
.composer textarea:focus { outline: none; }
.composer .attach { background: var(--surface-2); box-shadow: none; width: 44px; height: 44px; color: var(--accent); }
.pending-imgs { display: flex; gap: 8px; flex-wrap: wrap; }
.pending-imgs:empty { display: none; }
.pending-imgs .pi { position: relative; }
.pending-imgs img { width: 62px; height: 62px; object-fit: cover; border-radius: 12px; }
.pending-imgs button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg); background: var(--ink); color: var(--surface); font-size: 14px; line-height: 1; font-weight: 700; }
.sendbtn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.sendbtn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.notice { font-size: 14px; padding: 10px 13px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--protein-soft); color: var(--protein); }

/* I dag: urskive-helt */
.datenav { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding-block: 4px 6px; }
.datenav .d { font-family: var(--f-display); font-weight: 800; font-size: 21px; text-align: center; flex: 1; }
.datenav .d small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-weight: 500; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 16px 20px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); }
.hero .dial { position: relative; width: 220px; max-width: 100%; aspect-ratio: 1; }
.hero .dial svg { width: 100%; height: 100%; }
.hero .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hero .center .eyebrow { font-size: 13px; }
.hero .center .n { font-family: var(--f-display); font-weight: 900; font-size: 52px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hero .center .n.over { color: var(--warn); }
.hero .center .of { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.hero .legend { display: flex; gap: 18px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; justify-content: center; }
.hero .legend b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tile .k { font-size: 12px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.tile .t { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles .tile .t:empty { display: none; }
.tile.protein .v { color: var(--protein); }
.tile.carbs .v { color: var(--carbs); }
.tile.fat .v { color: var(--fat); }
.tile.fiber .v { color: var(--fiber); }
.garminrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-top: 10px; }
.garminrow .tile .v { font-size: 20px; }

/* Måltider */
.slot { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.slot > header { display: flex; align-items: center; gap: 10px; }
.slot .sd { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.slot .sd.frokost { background: #f2a93b; } .slot .sd.lunsj { background: #7cb342; } .slot .sd.middag { background: #0f9f8f; } .slot .sd.kvelds { background: #3d6fe0; }
.slot .st { font-family: var(--f-display); font-weight: 800; font-size: 17px; flex: 1; min-width: 0; }
.slot .mk { font-family: var(--f-display); font-weight: 800; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.15; }
.slot .mk em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--protein); }
.addbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 700; line-height: 1; flex: none; display: grid; place-items: center; }
.addbtn:hover { background: var(--accent); color: var(--accent-ink); }
.slotempty { border: 1.5px dashed var(--surface-3); background: transparent; border-radius: var(--r-sm); padding: 10px; color: var(--ink-3); font-weight: 700; font-size: 14px; }
.slotempty:hover { border-color: var(--accent); color: var(--accent); }
.slot.isempty { box-shadow: none; background: rgba(255, 255, 255, .55); }
.meal { border-top: 1px solid var(--rule); padding-top: 8px; }
.meal .mhead { display: flex; align-items: center; gap: 8px; }
.meal .mhead .mn { font-weight: 700; font-size: 14px; color: var(--ink-2); flex: 1; min-width: 0; }
.meal header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meal header .mt { font-family: var(--f-display); font-weight: 800; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; text-transform: capitalize; }
.meal header .mn { font-weight: 600; flex: 1; min-width: 0; font-size: 15px; }
.meal header .mk { font-family: var(--f-display); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meal header .mk em { font-style: normal; color: var(--protein); margin-left: 6px; font-size: 15px; }
.items { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 6px; }
.items td { padding: 7px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.items td.n { padding-right: 8px; }
.items td.n .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 14px; line-height: 1.3; }
.items td.n .sub { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.items td.a { width: 78px; }

.est { color: var(--warn); font-weight: 800; margin-left: 2px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; }
.list { display: flex; flex-direction: column; gap: 8px; }

/* Næringsdeklarasjon i produktark */
.label { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; }
.label .lh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.label .lh h3 { color: var(--ink); }
.label .lrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.label .lrow:last-child { border-bottom: 0; }
.label .lrow.sub { padding-left: 14px; color: var(--ink-2); font-size: 14px; }
.label .lrow .v { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; text-align: right; }
.label .lrow .t { font-size: 12px; color: var(--ink-3); text-align: right; }
.label .lrow.protein .v { color: var(--protein); }

/* Ark (modal) */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 720px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; border-top: 1px solid var(--rule);
  padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 10px; }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.sheet .sh h2 { font-size: 24px; font-weight: 800; flex: 1; min-width: 0; line-height: 1.1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-size: 14.5px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 12px 30px rgba(20, 30, 45, .3); }
.toast button { background: none; border: 0; color: var(--accent-2); font-weight: 800; }

.empty { text-align: center; padding: 28px 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 22px; }
.chart { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--f-display); font-size: 11px; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 14px; font-weight: 600; border-radius: 999px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
details { background: var(--surface); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 10px 14px; }
details > summary { cursor: pointer; font-weight: 600; }
details .tbl { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14.5px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
a { color: var(--accent); }
label.row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.statline { display: flex; gap: 8px; flex-wrap: wrap; }
/* Flyt: raske, myke overganger. Ingenting animeres på nytt når innholdet ikke er endret. */
html, body { overscroll-behavior: none; }
.view, .messages, .sheet { overscroll-behavior: contain; }
button, .li, .chip, .face, [role="button"], a, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .li, .iconbtn, .sendbtn, .addbtn, .fab, .face, .slotempty, nav.tabs button, .seg button, .ckseg button, .xbtn {
    transition: transform .16s cubic-bezier(.2, .8, .2, 1), background-color .2s ease, color .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active, .chip:active, .li:active, .iconbtn:active, .sendbtn:active, .addbtn:active, .fab:active, .face:active, .slotempty:active, .seg button:active, .ckseg button:active, .xbtn:active { transform: scale(.96); }
  nav.tabs button:active svg { transform: scale(.9); }
  nav.tabs button svg { transition: background-color .25s ease, transform .16s ease; }
  .view.enter { animation: viewIn .26s cubic-bezier(.2, .8, .2, 1); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.fresh { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
  .bar > i { transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .sheet-bg { animation: fadeIn .22s ease-out; }
  .sheet-bg .sheet { animation: sheetUp .3s cubic-bezier(.2, .8, .2, 1); }
  .sheet-bg.closing { animation: fadeOut .2s ease-in forwards; }
  .sheet-bg.closing .sheet { animation: sheetDown .2s ease-in forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes sheetDown { to { transform: translateY(40px); opacity: 0; } }
  .toast { animation: toastIn .25s cubic-bezier(.2, .8, .2, 1); }
  .toast.closing { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, 12px); } }
  .action { animation: rise .22s ease-out; }
  .proposal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ring .arc, .dial .arc { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
  .msg.assistant .bubble.thinking::after { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
}

#v-matvarer { padding-bottom: 96px; }

/* ---------- Varm glass-stil: mørk espresso-bakgrunn med myke lyskilder, frostede kort, rav aksent ---------- */
body { letter-spacing: -.01em; background: var(--bg); color: var(--ink); }
body::after { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38% 28% at 85% 6%, rgba(244, 162, 97, .28), transparent 70%),
    radial-gradient(45% 35% at 8% 30%, rgba(120, 82, 54, .45), transparent 72%),
    radial-gradient(55% 40% at 70% 75%, rgba(92, 62, 42, .5), transparent 72%),
    radial-gradient(40% 30% at 15% 95%, rgba(244, 162, 97, .14), transparent 70%),
    linear-gradient(180deg, #1b1511 0%, #120e0b 55%, #0d0a08 100%); }
body::before { background: transparent; }
h1, h2, h3, .brand .bt, h2.vh, .hero .center .n, .face .big, .tile .v { letter-spacing: -.025em; }

/* Glass-kort */
.face, .hero, .tile, .slot, .card, .tbl, .label, .chart, details, .proposal, .list, .gcard, .composer .row {
  background: var(--surface); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
}

.sheet { border-radius: 28px 28px 0 0; background: rgba(30, 24, 20, .86); -webkit-backdrop-filter: blur(30px) saturate(140%); backdrop-filter: blur(30px) saturate(140%); border-top: 1px solid var(--glass-edge); color: var(--ink); }

.toast button { color: var(--accent); }

/* Knapper, felt, segmenter: piller */

.meal header .mt { background: var(--accent-soft); color: var(--accent); }
.amt input { background: var(--surface-2); border-radius: 10px; color: var(--ink); }
.fab { border-radius: 50%; background: linear-gradient(150deg, #f7b77e, #ee9550); color: var(--accent-ink); box-shadow: 0 10px 24px rgba(244, 162, 97, .35); }

.ring .track { stroke: var(--track); }

.items td, .meal, .tbl td, .label .lrow, .label .lh { border-color: var(--rule); }
.items td { border-top: 1px solid var(--rule); }
.chart text { fill: var(--ink-3); }
.kv dt { color: var(--ink-3); }

/* Glass-diagrammer */

.gs { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

.corner svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.gbars { position: relative; height: 170px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; margin-top: 18px; padding-bottom: 22px; }

}

/* Logo og intro */
.brand .logo { background: linear-gradient(160deg, #3a2a1f, #15100c) !important; border: 1px solid rgba(255, 220, 190, .16); box-shadow: 0 8px 22px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08) !important; }
.brand .logo svg { width: 30px; height: 30px; }
.splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; overflow: hidden; }
.splash::before { content: ""; position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.2); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(244, 162, 97, .35), rgba(244, 162, 97, .08) 45%, transparent 70%); opacity: 0; animation: spBloom 1.6s .1s cubic-bezier(.2, .8, .2, 1) forwards; }
.splogo { position: relative; width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: linear-gradient(160deg, #2c2018, #0e0a08); border: 1px solid rgba(255, 220, 190, .14);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .08); animation: spPop 1s cubic-bezier(.16, 1, .3, 1) both; }
.splogo svg { width: 84px; height: 84px; overflow: visible; }
.splash .lA { stroke-dasharray: 120; stroke-dashoffset: 120; animation: spDraw .9s .2s cubic-bezier(.65, 0, .25, 1) forwards; }
.splash .lB { stroke-dasharray: 70; stroke-dashoffset: 70; animation: spDraw .8s .35s cubic-bezier(.65, 0, .25, 1) forwards; }
.splash .lC { transform-origin: 50.5px 32px; transform: scale(0); animation: spSpark .45s .95s cubic-bezier(.2, .9, .3, 1.6) forwards; filter: drop-shadow(0 0 6px rgba(255, 200, 150, .9)); }
.spname { position: relative; font-size: 56px; font-weight: 700; letter-spacing: -.045em; line-height: 1;
  background: linear-gradient(100deg, #8a7a6d 0%, #fbf6f1 35%, #ffd8b0 50%, #fbf6f1 65%, #8a7a6d 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: spUp .9s .45s cubic-bezier(.16, 1, .3, 1) both, spSheen 1.4s .6s ease-out both; }
.sptag { position: relative; font-size: 15px; font-weight: 500; color: rgba(251, 246, 241, .55); letter-spacing: .02em; animation: spUp .9s .7s cubic-bezier(.16, 1, .3, 1) both; }
.splash.out { animation: spOut .5s cubic-bezier(.6, 0, .4, 1) forwards; }
@keyframes spBloom { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes spPop { from { transform: scale(.82); opacity: 0; filter: blur(8px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes spDraw { to { stroke-dashoffset: 0; } }
@keyframes spSpark { to { transform: scale(1); } }
@keyframes spUp { from { transform: translateY(18px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes spSheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes spOut { to { opacity: 0; transform: scale(1.04); visibility: hidden; } }

/* Kameraskanner */

.scanner.closing { animation: fadeOut .2s ease-in forwards; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanframe { position: absolute; left: 10%; right: 10%; top: 50%; height: 26%; transform: translateY(-50%); border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); border: 2px solid rgba(255, 216, 176, .9); overflow: hidden; }
.scanframe i { position: absolute; left: 6%; right: 6%; height: 2px; top: 50%; background: linear-gradient(90deg, transparent, #ffd8b0, transparent); box-shadow: 0 0 12px #f4a261; animation: scanLine 1.6s ease-in-out infinite; }

@keyframes scanLine { 0%, 100% { transform: translateY(-36px); } 50% { transform: translateY(36px); } }
.scantop { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
.scanbot { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; }

<script>
/* Coach som egen app: gir appen det samme «claude.use()»-grensesnittet som i Claude, men med Supabase som database
 * og innlogging. Ingen AI: «sample» og «mcp» finnes ikke her, så appen bruker sitt eget skrivefelt og egne oppslag. */
(function () {
  'use strict';
  var CFG = window.COACH_CONFIG || {};
  var sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'coach-auth', storage: window.localStorage } });
  window.coachSupabase = sb;

  /* ---------- Dokumentlager over tabellen docs (col, id, data) ---------- */
  var cache = {};       // col -> Map(id -> data)
  var loaded = {};      // col -> Promise
  var listeners = {};   // col -> [fn]
  var docListeners = {}; // path -> [fn]
  var userId = null;

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function mapOf(col) { return cache[col] || (cache[col] = new Map()); }
  function err(e) { var x = new Error((e && e.message) || 'Databasefeil'); x.code = e && e.code === '42501' ? 'not_granted' : 'unknown'; return x; }

  async function fetchCol(col) {
    var all = [], from = 0, page = 1000;
    for (;;) {
      var r = await sb.from('docs').select('id,data').eq('col', col).range(from, from + page - 1);
      if (r.error) throw err(r.error);
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) break;
      from += page;
    }
    var m = new Map(); all.forEach(function (row) { m.set(row.id, row.data); });
    cache[col] = m;
    return m;
  }
  function ensure(col) { return loaded[col] || (loaded[col] = fetchCol(col).catch(function (e) { delete loaded[col]; throw e; })); }
  function snapDoc(col, id) {
    var m = mapOf(col), has = m.has(id);
    return { id: id, exists: has, data: function () { return has ? clone(m.get(id)) : undefined; }, metadata: { fromCache: false } };
  }
  function notify(col, id) {
    (listeners[col] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
    (docListeners[col + '/' + id] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
  }
  function notifyAll(col) {
    (listeners[col] || []).forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
    Object.keys(docListeners).forEach(function (p) { if (p.indexOf(col + '/') === 0) docListeners[p].forEach(function (f) { try { f(); } catch (e) {} }); });
  }

  function query(col, ord, lim) {
    function build() {
      var docs = Array.from(mapOf(col).keys()).map(function (id) { return snapDoc(col, id); });
      if (ord) docs.sort(function (a, b) { var x = a.data()[ord.f], y = b.data()[ord.f]; return (x < y ? -1 : x > y ? 1 : 0) * (ord.d === 'desc' ? -1 : 1); });
      if (lim) docs = docs.slice(0, lim);
      return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: { fromCache: false } };
    }
    return {
      orderBy: function (f, d) { return query(col, { f: f, d: d || 'asc' }, lim); },
      limit: function (n) { return query(col, ord, n); },
      where: function () { return query(col, ord, lim); },
      doc: function (id) { return doc(col + '/' + id); },
      get: async function () { await fetchCol(col); loaded[col] = Promise.resolve(cache[col]); return build(); },
      onSnapshot: function (next, onErr) {
        var f = function () { next(build()); };
        (listeners[col] = listeners[col] || []).push(f);
        ensure(col).then(f, function (e) { if (onErr) onErr(err(e)); });
        return function () { listeners[col] = (listeners[col] || []).filter(function (x) { return x !== f; }); };
      }
    };
  }
  function doc(path) {
    var parts = path.split('/'), col = parts[0], id = parts.slice(1).join('/');
    return {
      get: async function () {
        var r = await sb.from('docs').select('data').eq('col', col).eq('id', id).maybeSingle();
        if (r.error) throw err(r.error);
        if (r.data) mapOf(col).set(id, r.data.data); else mapOf(col).delete(id);
        return snapDoc(col, id);
      },
      set: async function (obj) {
        var data = clone(obj);
        var r = await sb.from('docs').upsert({ user_id: userId, col: col, id: id, data: data, updated_at: new Date().toISOString() }, { onConflict: 'user_id,col,id' });
        if (r.error) throw err(r.error);
        mapOf(col).set(id, data); notify(col, id);
      },
      delete: async function () {
        var r = await sb.from('docs').delete().eq('col', col).eq('id', id);
        if (r.error) throw err(r.error);
        mapOf(col).delete(id); notify(col, id);
      },
      onSnapshot: function (next, onErr) {
        var f = function () { next(snapDoc(col, id)); };
        (docListeners[path] = docListeners[path] || []).push(f);
        ensure(col).then(f, function (e) { if (onErr) onErr(err(e)); });
        return function () { docListeners[path] = (docListeners[path] || []).filter(function (x) { return x !== f; }); };
      }
    };
  }
  var db = { doc: doc, collection: function (c) { return query(c); } };

  /* Endringer fra andre steder (Garmin-synken, en annen enhet): hent samlingen på nytt. */
  var pending = {};
  function refreshCol(col) {
    if (pending[col]) return; pending[col] = setTimeout(function () {
      delete pending[col];
      if (!listeners[col] && !Object.keys(docListeners).some(function (p) { return p.indexOf(col + '/') === 0; })) return;
      fetchCol(col).then(function () { notifyAll(col); }, function () {});
    }, 300);
  }
  function startRealtime() {
    try {
      sb.channel('docs-' + userId).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + userId }, function (p) {
        var col = (p.new && p.new.col) || (p.old && p.old.col); if (col) refreshCol(col); else Object.keys(listeners).forEach(refreshCol);
      }).subscribe();
    } catch (e) { /* sanntid er bonus */ }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') Object.keys(cache).forEach(refreshCol); });
  }

  /* ---------- Innlogging ---------- */
  var dbReady, resolveDb;
  dbReady = new Promise(function (r) { resolveDb = r; });

  function loginHtml(mode, msg) {
    var su = mode === 'signup';
    return '<div class="authwrap"><div class="authcard">' +
      '<div class="authlogo">' + (window.COACH_LOGO_SVG || '') + '</div>' +
      '<h1>Coach</h1><p class="authsub">' + (su ? 'Lag bruker. Dataene dine er bare dine.' : 'Logg inn for å fortsette.') + '</p>' +

      '<input class="input" id="authPw" type="password" autocomplete="' + (su ? 'new-password' : 'current-password') + '" placeholder="Passord' + (su ? ' (minst 8 tegn)' : '') + '" required>' +

  }
  function showLogin(mode, msg) {
    var host = document.getElementById('authHost');
    if (!host) { host = document.createElement('div'); host.id = 'authHost'; document.body.appendChild(host); }
    host.innerHTML = loginHtml(mode, msg);
    var form = document.getElementById('authForm');
    form.onsubmit = async function (e) {
      e.preventDefault();
      var email = document.getElementById('authEmail').value.trim(), pw = document.getElementById('authPw').value;
      var box = document.getElementById('authMsg'), btn = form.querySelector('button[type=submit]');
      if (!email || !pw) { box.innerHTML = '<div class="notice bad">Fyll inn e-post og passord.</div>'; return; }
      btn.disabled = true;
      try {
        if (mode === 'signup') {
          if (pw.length < 8) throw new Error('Passordet må ha minst 8 tegn.');
          var s = await sb.auth.signUp({ email: email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
          if (s.error) throw s.error;
          if (!s.data.session) { showLogin('login', '<div class="notice info">Sjekk e-posten din og trykk på bekreftelseslenken. Logg så inn her.</div>'); return; }
        } else {
          var l = await sb.auth.signInWithPassword({ email: email, password: pw });
          if (l.error) throw l.error;
        }
      } catch (er) {
        var m = String(er.message || er);
        if (/Invalid login/i.test(m)) m = 'Feil e-post eller passord.';
        if (/not confirmed/i.test(m)) m = 'E-posten er ikke bekreftet ennå. Sjekk innboksen.';
        if (/already registered/i.test(m)) m = 'Det finnes allerede en bruker med denne e-posten.';
        box.innerHTML = '<div class="notice bad">' + m.replace(/</g, '&lt;') + '</div>';
        btn.disabled = false;
      }
    };
    document.getElementById('authSwitch').onclick = function () { showLogin(mode === 'signup' ? 'login' : 'signup'); };
    var fg = document.getElementById('authForgot');
    if (fg) fg.onclick = async function () {
      var email = document.getElementById('authEmail').value.trim(), box = document.getElementById('authMsg');
      if (!email) { box.innerHTML = '<div class="notice bad">Skriv inn e-posten din først.</div>'; return; }

      box.innerHTML = r.error ? '<div class="notice bad">' + r.error.message + '</div>' : '<div class="notice info">Sjekk e-posten for lenke til nytt passord.</div>';
    };
  }
  function hideLogin() { var h = document.getElementById('authHost'); if (h) h.remove(); }

  var started = false;
  function onSession(session) {
    if (!session) { showLogin('login'); return; }
    hideLogin();
    if (started) { if (session.user.id !== userId) location.reload(); return; }
    started = true; userId = session.user.id;
    startRealtime();
    resolveDb(db);
  }
  sb.auth.onAuthStateChange(function (ev, session) {
    if (ev === 'PASSWORD_RECOVERY') {
      var pw = prompt('Nytt passord (minst 8 tegn):');
      if (pw && pw.length >= 8) sb.auth.updateUser({ password: pw }).then(function (r) { alert(r.error ? r.error.message : 'Passordet er endret.'); });

  });

  /* ---------- claude.use()-grensesnittet ---------- */
  var downloads = {
    save: async function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([typeof o.data === 'string' ? o.data : JSON.stringify(o.data)], { type: 'application/json' });

      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

    }

  };

  /* ---------- Energibehov fra reelle data ----------

  async function updateMeal(ctx, args) {
    var date = args.date;
    if (!isDate(date)) throw new Error('Ugyldig dato: ' + date);
    var day = await getDay(ctx, date);
    var meal = (day.meals || []).find(function (m) { return m.id === args.meal_id; });
    if (!meal) throw new Error('Fant ikke måltidet ' + args.meal_id + ' på ' + date + '.');
    var changed = [];
    var scale = E.num(args.scale);
    if (scale !== null) {
      if (!(scale > 0 && scale <= 10)) throw new Error('Ugyldig faktor: ' + args.scale);
      var targetIds = args.scale_item_ids && args.scale_item_ids.length ? args.scale_item_ids : meal.items.map(function (i) { return i.id; });
      args.set_amounts = (args.set_amounts || []).concat(meal.items.filter(function (i) { return targetIds.indexOf(i.id) >= 0; }).map(function (i) { return { item_id: i.id, amount: E.round(i.amount * scale, 2) }; }));
    }
    (args.set_amounts || []).forEach(function (s) {
      var it = meal.items.find(function (i) { return i.id === s.item_id; });
      if (!it) throw new Error('Fant ikke ingrediensen ' + s.item_id);
      var n = E.num(s.amount);
      if (n === null || n < 0) throw new Error('Ugyldig mengde for ' + it.name);
      var unit = s.unit || it.unit;
      /* Bruk produktdata slik de var ved registrering (snapshot), så historikk ikke endres i stillhet. */
      var pseudo = { name: it.name, per100: it.per100, basis: it.basis, state: it.state };
      var live = ctx.products.get(it.productId);
      if (live) { pseudo.unitWeights = live.unitWeights; pseudo.servingSize = live.servingSize; pseudo.edibleFactor = live.edibleFactor; pseudo.density = live.density; }
      var c = E.calcItem(pseudo, n, unit);
      changed.push(it.name + ': ' + E.round(it.amount, 1) + ' → ' + n + ' ' + E.normUnit(unit));
      it.amount = n; it.unit = E.normUnit(unit); it.qty = c.qty; it.values = c.values; it.notes = c.notes;
      if (s.amount_source) { it.amountSource = s.amount_source; }
      it.modified = true;
    });
    if (args.remove_item_ids && args.remove_item_ids.length) {
      var before = meal.items.length;
      meal.items = meal.items.filter(function (i) {
        var rm = args.remove_item_ids.indexOf(i.id) >= 0;
        if (rm) changed.push('fjernet ' + i.name);
        return !rm;
      });
      if (before - meal.items.length !== args.remove_item_ids.length) throw new Error('Noen av ingrediensene som skulle fjernes ble ikke funnet.');
    }
    (args.add_items || []).forEach(function (it) { var s = snapshotItem(ctx, it); meal.items.push(s); changed.push('la til ' + s.name); });
    if (args.meal_type) { meal.type = mealType(args.meal_type); changed.push('type → ' + meal.type); }
    if (args.name) { meal.name = String(args.name); }
    if (args.status === 'bekreftet' || args.status === 'estimat') meal.status = args.status;
    else if (meal.status !== 'foreslått') meal.status = meal.items.some(function (i) { return i.estimated; }) ? 'estimat' : 'bekreftet';
    var removedMeal = null;
    if (!meal.items.length) { day.meals = day.meals.filter(function (m) { return m !== meal; }); removedMeal = meal; changed.push('måltidet var tomt og ble fjernet'); }
    meal.updatedAt = nowIso(ctx);
    day.updatedAt = meal.updatedAt;
    await ctx.repo.set('days/' + date, day);
    await logChange(ctx, 'måltid endret', date + ' ' + meal.name + ': ' + changed.join('; '));
    return { meal: removedMeal ? null : meal, day: day, changes: changed };
  }

  /* ---------- Oppskrifter ---------- */
  async function saveRecipe(ctx, args) {

      var amount = E.num(it.amount);

      return { key: it.key || slug(ctx.products.get(pid).name).split('-')[0] + (i ? '-' + i : ''), productId: pid, amount: amount, unit: E.normUnit(it.unit || 'g') };
    });
    if (!items.length) throw new Error('Oppskriften må ha minst én ingrediens.');
    var keys = {};
    items.forEach(function (it) { if (keys[it.key]) it.key = it.key + '-' + Math.random().toString(36).slice(2, 4); keys[it.key] = 1; });
    var portions = E.num(args.portions) || 1;

    var ver = { version: existing ? existing.currentVersion + 1 : 1, portions: portions, cookedWeightG: E.num(args.cooked_weight_g), items: items, notes: args.notes || '', createdAt: t };

      if (args.name) r.name = args.name;

      r.updatedAt = t;
    } else {
      var dupe = null;
      ctx.recipes.forEach(function (x) { if (norm(x.name) === norm(args.name)) dupe = x; });
      if (dupe) throw new Error('Oppskriften «' + dupe.name + '» finnes allerede (' + dupe.id + '). Oppdater den i stedet.');

  async function weekSummary(ctx, endDate, nDays) {
    nDays = nDays || 7;
    var days = [], weights = [], i;
    var all = await ctx.repo.list('days');
    var byDate = {}; all.forEach(function (d) { byDate[d.date] = d; });
    for (i = nDays - 1; i >= 0; i--) {
      var ds = addDays(endDate, -i);
      var d = byDate[ds];
      var tt = d ? E.dayTotals(d) : null;
      days.push({ date: ds, logged: !!(tt && tt.items), kcal: tt && tt.items ? E.round(tt.values.kcal) : null, protein: tt && tt.items ? E.round(tt.values.protein, 1) : null, estimatedItems: tt ? tt.estimated : 0 });
    }
    var wAll = (await ctx.repo.list('weights')).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var start = addDays(endDate, -(nDays - 1));
    weights = wAll.filter(function (w) { return w.date >= start && w.date <= endDate; });
    var prevStart = addDays(start, -nDays), prevEnd = addDays(start, -1);
    var prevWeights = wAll.filter(function (w) { return w.date >= prevStart && w.date <= prevEnd; });
    var workouts = (await ctx.repo.list('workouts')).filter(function (w) { return w.date >= start && w.date <= endDate && !w.planned; });
    var logged = days.filter(function (d) { return d.logged; });
    function avg(arr, k) { return arr.length ? arr.reduce(function (s, x) { return s + x[k]; }, 0) / arr.length : null; }
    /* Adaptivt estimat over 28 dager */
    var tdeeStart = addDays(endDate, -27);

      var x = E.dayTotals(d); return { date: d.date, kcal: x.values.kcal, complete: !!d.complete || x.items >= 3 };
    });

    return {
      from: start, to: endDate,
      days: days,
      avgKcal: E.round(avg(logged, 'kcal')), avgProtein: E.round(avg(logged, 'protein'), 1), loggedDays: logged.length,
      weight: { avgThisPeriod: E.round(avg(weights, 'kg'), 2), avgPrevPeriod: E.round(avg(prevWeights, 'kg'), 2), weighIns: weights.length },

      adaptiveTdee: ad ? { kcal: E.round(ad.tdee, -1), avgIntake: E.round(ad.avgIntake), kgPerWeek: E.round(ad.kgPerWeek, 2), basedOnDays: ad.days, weighIns: ad.weighIns } : null
    };
  }

  /* ---------- Skrivefelt uten AI ----------
   * «frokost: 300 g q yoghurt, 30 g havregryn og 100 g bær» -> linjer med mengde, enhet og beste treff i
   * matvarer/oppskrifter. aliases: {normalisert tekst: produkt-id} som appen har lært av tidligere valg. */
  var UNIT_WORDS = { g: 'g', gr: 'g', gram: 'g', kg: 'kg', ml: 'ml', dl: 'dl', l: 'l', liter: 'l', stk: 'stk', stykk: 'stk', st: 'stk', porsjon: 'porsjon', porsjoner: 'porsjon', pors: 'porsjon', pakke: 'pakke', pakker: 'pakke', pk: 'pakke', boks: 'pakke', skive: 'stk', skiver: 'stk' };
  var MEAL_WORDS = { frokost: 'frokost', lunsj: 'lunsj', lunch: 'lunsj', middag: 'middag', kvelds: 'kvelds', kveldsmat: 'kvelds', mellommåltid: 'mellommåltid', mellommaltid: 'mellommåltid', snack: 'mellommåltid' };
  function mealTypeForHour(h) { return h < 10 ? 'frokost' : h < 14 ? 'lunsj' : h < 17 ? 'mellommåltid' : h < 20 ? 'middag' : 'kvelds'; }
  function matchScore(query, p) {
    var words = norm(query).split(' ').filter(function (w) { return w.length > 1 || /\d/.test(w); });
    if (!words.length) return 0;
    var hay = norm([p.name, p.brand, p.variant].concat(p.aliases || []).join(' '));
    if ((p.aliases || []).some(function (a) { return norm(a) === norm(query); }) || norm(p.name) === norm(query)) return 1;
    var hit = words.filter(function (w) { return hay.indexOf(w) >= 0 || (w.length > 4 && hay.indexOf(w.slice(0, -1)) >= 0); }).length;
    return hit / words.length;
  }
  function parseFoodText(ctx, text, opts) {
    opts = opts || {};
    var raw = String(text || '').trim();
    var mt = null;
    var lead = /^\s*(frokost|lunsj|lunch|middag|kveldsmat|kvelds|mellommåltid|mellommaltid|snack)\b\s*[:\-–]?\s*/i.exec(raw);
    if (lead) { mt = MEAL_WORDS[lead[1].toLowerCase()]; raw = raw.slice(lead[0].length); }
    var any = /\btil\s+(frokost|lunsj|lunch|middag|kveldsmat|kvelds|mellommåltid|snack)\b/i.exec(raw);
    if (any) { mt = mt || MEAL_WORDS[any[1].toLowerCase()]; raw = raw.replace(any[0], ' '); }
    raw = raw.replace(/^(jeg\s+)?(spiste|har spist|åt|drakk|hadde)\s+/i, '');
    var aliases = opts.aliases || {};
    raw = raw.replace(/(\D)\.(\s+|$)/g, '$1,').replace(/(\d\s*[a-zæøå]+)\.(\s+|$)/gi, '$1,');
    var parts = raw.split(/\s*(?:(?<!\d),|,(?!\d)|;|\+|\n|\s+og\s+|\s+med\s+)\s*/i).map(function (x) { return x.trim(); }).filter(Boolean);
    var lines = parts.map(function (part) {
      var amount = null, unit = null, name = part;

      if (m) { amount = E.num(m[1]); unit = m[2] ? UNIT_WORDS[m[2].toLowerCase()] : null; name = (part.slice(0, m.index) + ' ' + part.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim(); }
      else { var wn = /^(en|ett|ei|én|to|tre|fire|fem|halv|en halv)\s+/i.exec(part); if (wn) { amount = { en: 1, ett: 1, ei: 1, 'én': 1, to: 2, tre: 3, fire: 4, fem: 5, halv: 0.5, 'en halv': 0.5 }[wn[1].toLowerCase()]; name = part.slice(wn[0].length).trim(); } }
      name = name.replace(/^(av|med)\s+/i, '').replace(/\s+(av|med)$/i, '').trim();
      var line = { raw: part, name: name, amount: amount, unit: unit, kind: null, id: null, candidates: [], confident: false };
      var key = norm(name);
      var rec = findRecipe(ctx, name);
      if (!rec) ctx.recipes.forEach(function (x) { if (!rec && [x.name].concat(x.aliases || []).some(function (a) { var n = norm(a); return n && (key.indexOf(n) >= 0 || n.indexOf(key) >= 0) && key.length >= 4; })) rec = x; });
      if (rec && !(aliases[key])) {
        line.kind = 'recipe'; line.id = rec.id; line.confident = true;
        if (line.amount === null || (line.unit && line.unit !== 'porsjon')) { if (line.unit && line.unit !== 'porsjon') { line.kind = null; } else { line.amount = 1; line.unit = 'porsjon'; } }
        if (line.kind) return line;
      }
      var cands = findProducts(ctx, name, 6);

        i--;

          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';

  async function send(override) {
    var inp = $('#msgInput');

    if (S.streaming) return;
    if (!text && !S.pendingImages.length) return;
    if (S.status !== 'ready') { toast('Venter på databasen …'); return; }
    if (!S.sample) {
      if (!text) { toast('Skriv hva du har spist.'); return; }
      if (!override) { inp.value = ''; autosize(); }
      if (S.view !== 'chat') go('chat');
      try { await localTurn(text); } catch (e) { toast(e.message); }
      return;
    }
    var files = S.pendingImages.map(function (p) { return p.file; });
    S.pendingImages.forEach(function (p) { URL.revokeObjectURL(p.url); });
    S.pendingImages = []; renderPending();
    if (!override) { inp.value = ''; autosize(); }
    if (S.view !== 'chat') go('chat');

    var assetIds = [];
    if (files.length && S.assets) {
      for (var i = 0; i < files.length; i++) {
        try { var up = await S.assets.upload(files[i], { type: files[i].type }); assetIds.push(up.id); } catch (e) { /* bildet sendes likevel til Claude */ }
      }
    }
    var history = historyTurns();
    var userMsg = { id: C.uid('u'), role: 'user', text: text, ts: new Date().toISOString(), images: assetIds, imageCount: files.length };
    try { await appendChat(userMsg); } catch (e) { toast(e.message); }
    renderMessages();

    var am = { id: C.uid('a'), role: 'assistant', text: '', ts: new Date().toISOString(), actions: [] };
    turnState = { msg: am, assetIds: assetIds };
    var el = $('#messages');
    var wrap = document.createElement('div');
    wrap.className = 'msg assistant fresh';
    S.seen.add(am.id);
    wrap.innerHTML = '<div class="who"><i></i>Coach</div><div class="actions"></div><div class="bubble thinking">Tenker</div>';
    el.appendChild(wrap); scrollChat();
    var actEl = wrap.querySelector('.actions'), bub = wrap.querySelector('.bubble');
    turnState.renderActions = function () { actEl.innerHTML = actionItems(am.actions); scrollChat(); };

    S.streaming = true; setSendMode(true);
    var ctl = new AbortController(); S.abort = ctl;
    var userContent = (text || '(Brukeren sendte bilde(r) uten tekst – analyser og spør hva brukeren ønsker hvis formålet er uklart.)') + (files.length ? '\n[' + files.length + ' bilde(r) vedlagt denne meldingen]' : '') + (override && override.extra ? '\n\n' + override.extra : '');

    var tools = buildTools();
    var useNative = S.toolsOk && S.toolMode !== 'json';
    try {
      if (useNative) {
        var input = [{ role: 'user', content: rules() + '\n\n' + contextBlock() }].concat(history).concat([{ role: 'user', content: userContent }]);
        var opts = { signal: ctl.signal, onText: onText, tools: S.toolMax ? tools.slice(0, S.toolMax) : tools };
        if (files.length && S.imagesOk) opts.images = files;
        try {
          var res = await S.sample(input, opts);
          am.text = res.text;
          if (res.truncated) am.interrupted = 'Svaret ble kuttet fordi det ble for langt.';
        } catch (e) {
          // Visninger som ikke kan kjøre sideverktøy (f.eks. noen mobilvisninger) avviser kallet med en gang.
          // Da prøver vi én gang i JSON-modus, der appen selv utfører handlingene.
          if (!fallbackable(e) || am.actions.length || (e && e.text)) throw e;
          S.toolMode = 'json';
          am.fallbackFrom = e && e.code;
          await jsonTurn(history, userContent, files, ctl, tools, am, onText);
        }
      } else {
        await jsonTurn(history, userContent, files, ctl, tools, am, onText);
      }
    } catch (e) {
      am.text = (e && e.text ? e.text : '') || am.text || '';
      am.interrupted = sampleErrorText(e);

    }
    am.ts = new Date().toISOString();
    S.streaming = false; S.abort = null; setSendMode(false);
    turnState = null;
    try { await appendChat(am); } catch (e) { toast(e.message); }
    if (S.chatDirty) { var snap = S.chatDirty; S.chatDirty = null; S.chats = new Map(); snap.docs.forEach(function (d) { S.chats.set(d.id, clone(d.data())); }); }
    renderMessages();
  }

  async function localTurn(text) {
    var t = text.trim();
    var wm = /^(vekt|veide|vei|veier)\b[^\d]*(\d{2,3}(?:[.,]\d+)?)/i.exec(t);
    if (wm) {
      var w = await C.logWeight(ctx, { date: today(), kg: E.num(wm[2]) });
      await localSay(t, 'Vekt lagret: **' + fmt(w.kg, 1) + ' kg** (' + dateLabel(w.date) + ').');
      return;
    }
    if (/\d+(?:[.,]\d+)?\s*(?:kg)?\s*[x×]\s*\d/i.test(t)) {
      var split = (/\b(push|pull|bein|overkropp|fullkropp)\b/i.exec(t) || [null, 'Styrketrening'])[1].replace(/^./, function (c) { return c.toUpperCase(); }) + (/volum/i.test(t) ? ' (volum)' : '');
      var body = t.replace(/^\s*(push|pull|bein|overkropp|fullkropp)\b[^:\n]*:\s*/i, '').replace(/(\d)\s*[,;]\s*(?=[a-zæøå])/gi, '$1\n').replace(/\s+og\s+(?=[a-zæøå])/gi, '\n');
      var ses = C.parseWorkoutNotes(body, { today: today(), date: today(), title: split });
      if (ses.length) {
        var out = [];
        for (var i = 0; i < ses.length; i++) {
          var ws = await C.logStrength(ctx, { date: ses[i].date, title: ses[i].title, exercises: ses[i].exercises.filter(function (e) { return e.sets.length; }) });
          out.push(ws.title + ' (' + dateLabel(ws.date) + '): ' + ws.exercises.map(function (e) { return e.name + ' ' + e.sets.map(setTxt).join(', '); }).join(' · ') + (ws.merged ? ' · lagt til Garmin-økten' : ''));
        }
        await localSay(t, 'Økt lagret.\n\n' + out.join('\n\n'));
        return;
      }
    }
    var aliases = await loadAliases();
    var parsed = C.parseFoodText(ctx, t, { aliases: aliases });
    if (!parsed.lines.length) { toast('Skriv mat og mengde, f.eks. «300 g yoghurt, 30 g havregryn».'); return; }
    if (window.COACH_STANDALONE) {
      await Promise.all(parsed.lines.map(async function (l) {
        if (l.kind === 'recipe' || (l.kind === 'product' && l.confident)) return;
        var m = []; try { m = await mvtSearch(l.name, 5); } catch (e) { m = []; }
        l.mvt = m.map(function (x) { return x.id; });
        if (!l.kind && m.length) { l.kind = 'product'; l.id = m[0].id; l.confident = false; if (l.amount !== null && !l.unit) l.unit = 'g'; }
      }));
    }
    openFoodConfirm(t, parsed);
  }

  function scrollInView(el, top) {

    var r = el.getBoundingClientRect(), vr = v.getBoundingClientRect(), y = v.scrollTop;
    if (top) y += r.top - vr.top - 8;
    else if (r.bottom > vr.bottom - 12) y += r.bottom - vr.bottom + 24;
    else if (r.top < vr.top) y += r.top - vr.top - 8;
    else return;
    v.scrollTo({ top: Math.max(0, y), behavior: MOTION ? 'smooth' : 'auto' });
    resetPageScroll();
  }

  /* ---------- Enheter: gram eller stk ----------

  function unitMem() { try { return JSON.parse(localStorage.getItem('coach.units') || '{}') || {}; } catch (e) { return {}; } }
  function rememberUnit(pid, unit, amount) { try { var m = unitMem(); m[pid] = { unit: unit, amount: amount }; localStorage.setItem('coach.units', JSON.stringify(m)); } catch (e) {} }

  // JSON-modus: Claude svarer med handlinger som appen utfører med de samme verktøyfunksjonene.

    t = String(t || '').trim();

    if (f) { try { return JSON.parse(f[1]); } catch (e) { /* videre */ } }

  async function jsonTurn(history, userContent, files, ctl, tools, am, onText) {
    var avail = tools.filter(function (t) { return JSON_TOOLS.indexOf(t.name) >= 0; });
    var spec = avail.map(function (t) { return '- ' + t.name + ': ' + t.description + '\n  input: ' + JSON.stringify(t.inputSchema || {}); }).join('\n');
    var how = '\n\nSVARFORMAT I DENNE VISNINGEN: Du kan ikke kalle verktøy direkte. Svar KUN med ett JSON-objekt, uten annen tekst:\n' +
      '{"svar": "kort tekst til brukeren", "handlinger": [{"verktoy": "<navn>", "input": {…}}]}\n' +
      'Appen utfører handlingene i rekkefølge og legger selv til kcal, protein og hva som er igjen i dag. Skriv derfor ingen næringstall i "svar" når du registrerer noe; si kort hva som ble gjort. Ingen handlinger = tom liste. ' +
      'save_food_product skal alltid ha user_confirmed=false her. Tilgjengelige handlinger:\n' + spec;
    var input = [{ role: 'user', content: rules() + how + '\n\n' + contextBlock() }].concat(history).concat([{ role: 'user', content: userContent + '\n\n(Svar med JSON-objektet.)' }]);
    var opts = { signal: ctl.signal, cache: false };
    if (files.length && S.imagesOk) opts.images = files;
    var res = await S.sample(input, opts);
    var obj = parseJsonReply(res.text);
    if (!obj || typeof obj !== 'object') { am.text = res.text; return; }
    var lines = [], lastMeal = null;
    var acts = Array.isArray(obj.handlinger) ? obj.handlinger.slice(0, 8) : [];
    for (var i = 0; i < acts.length; i++) {
      var h = acts[i] || {}, name = String(h.verktoy || h['verktøy'] || h.tool || '');
      var t = avail.find(function (x) { return x.name === name; });
      if (!t) continue;
      var inp = h.input && typeof h.input === 'object' ? h.input : {};
      if (name === 'save_food_product') inp.user_confirmed = false;
      try {
        var r = await t.execute(inp, { signal: ctl.signal });
        if (r && r.meal_totals) lastMeal = r;
      } catch (e) { lines.push('Kunne ikke utføre ' + name + ': ' + e.message); }
    }

  function planSummary(plan) {
    if (!plan.ok) return { ok: false, missing: plan.missing };
    var t = plan.targets;
    return {
      ok: true,
      energy: { bmr: Math.round(plan.energy.bmr), tdee_estimate: Math.round(plan.energy.tdee), range: [Math.round(plan.energy.low), Math.round(plan.energy.high)], components: plan.energy.components.map(function (c) { return c.label + ': ' + Math.round(c.kcal) + ' kcal'; }), assumptions: plan.energy.assumptions },
      inputs: { weightKg: E.round(plan.inputs.weightKg, 1), weightSource: plan.inputs.weightSource, goal: plan.inputs.goal, pace: plan.inputs.pace },
      suggested_targets: { kcal: t.kcal, protein: t.protein, fat: t.fat, carbs: t.carbs, fiber: t.fiber, waterMl: t.waterMl, kgPerWeek: E.round(t.kgPerWeek, 2), daily_adjust: t.adjust, why: t.why, warnings: t.warnings },
      current_targets: plan.current, external_estimates: plan.external,
      adaptive: plan.adaptive ? { tdee: Math.round(plan.adaptive.tdee), kgPerWeek: E.round(plan.adaptive.kgPerWeek, 2), days: plan.adaptive.days } : null,
      recommendation: plan.recommendation
    };
  }

  function syncGarmin(days) {
    days = days || 7;
    if (!S.garminAvail) { toast('Garmin er bare tilgjengelig i Claude-skrivebordsappen med tilkoblingen satt opp.'); return; }
    var end = today(), start = C.addDays(end, -(days - 1));
    var known = S.workouts.filter(function (w) { return w.externalId && w.date >= start; }).map(function (w) { return w.externalId; });
    var manualW = S.weights.filter(function (w) { return w.date >= start && w.source !== 'garmin'; }).map(function (w) { return w.date; });
    try { localStorage.setItem('pt.garminSync', new Date().toISOString()); S.lastGarminSync = new Date().toISOString(); } catch (e) {}
    send({
      text: 'Synk Garmin (' + days + ' dager)',
      extra: 'GARMIN-SYNK ' + start + ' til ' + end + '. Gjør dette med verktøyene, uten å gjette: ' +
        '1) garmin_search_activities {start, end, limit: 30}. Registrer hver økt med log_workout: external_id "garmin:<activityId>", date = lokal startdato, title = aktivitetsnavnet, type styrke for strength_training og for indoor_cardio («Utholdenhet» – brukeren bruker den til styrketrening; title «Styrketrening», duration_min, avg_hr, max_hr), kondisjon for løping/gåing/tredemølle/sykling/elliptical o.l., ellers annet. For kondisjon: cardio.duration_min (duration sekunder/60), distance_km (meter/1000), speed_kmh (averageSpeed m/s × 3,6), avg_hr, max_hr, modality fra typen. Allerede registrerte external_id: ' + JSON.stringify(known) + ' – hopp over disse. ' +
        '2) garmin_get_weight {start, end}: for hver dag med veiing, log_body_weight med kg = gram/1000 (én desimal) og source "garmin". Dager med manuell veiing som skal beholdes: ' + JSON.stringify(manualW) + '. ' +
        '3) garmin_get_daily_summaries og garmin_get_sleep_summaries {start, end} (og gjerne garmin_get_hrv_summaries): save_daily_metrics per dato med de tallene som finnes, inkludert totalKcal (calories.burnedTotal), restingKcal (burnedResting) og activeKcal (burnedActive). ' +
        'Brukes aktive kalorier fra Garmin, skal de ALDRI endre kalorimålet eller gi «spis tilbake»-råd. Avslutt med en kort oppsummering: antall nye økter, vekttrend og søvn, og eventuelle feil. Er Garmin-tilkoblingen ikke tilgjengelig eller feiler, si det tydelig.'
    });
  }

  /* ---------- I dag ---------- */
  /* Glass-søyler: kcal siste 7 dager, valgt dag fremhevet med verdi over. */
  function weekChartHtml(date, tg) {
    var days = [];
    for (var i = 6; i >= 0; i--) { var d = C.addDays(date, -i); days.push({ date: d, kcal: dayTotalsFor(d).values.kcal || 0 }); }
    var max = Math.max(tg.kcal || 0, Math.max.apply(null, days.map(function (x) { return x.kcal; }))) || 1;
    var logged = days.filter(function (x) { return x.kcal > 0; });
    var avg = logged.length ? logged.reduce(function (a, x) { return a + x.kcal; }, 0) / logged.length : null;
    var line = tg.kcal ? (100 - tg.kcal / max * 100) : null;
    return '<div class="gcard chartcard"><div class="gch"><div><div class="gt">Kalorier</div><div class="gs">Siste 7 dager' + (avg !== null ? ' · snitt ' + fmt(avg) + ' kcal' : '') + '</div></div><button class="corner" data-goto="fremgang" aria-label="Fremgang">' + ICON.arrowUR + '</button></div>' +
      '<div class="gbars">' + (line !== null ? '<div class="gline" style="top:' + line.toFixed(1) + '%"><span>' + fmt(tg.kcal) + '</span></div>' : '') +
      days.map(function (x) {
        var h = Math.max(3, x.kcal / max * 100), on = x.date === date;
        return '<div class="gcol' + (on ? ' on' : '') + '">' + (on && x.kcal ? '<div class="gtip">' + fmt(x.kcal) + '</div>' : '') + '<div class="gbar" style="height:' + h.toFixed(1) + '%"></div><div class="glab">' + esc(new Date(x.date + 'T12:00:00').toLocaleDateString('nb-NO', { weekday: 'short' }).replace('.', '')) + '</div></div>';
      }).join('') + '</div></div>';
  }
  /* Donut: andel av energien fra protein, karbo og fett. */
  function macroDonutHtml(v) {
    var parts = [{ k: 'Protein', kcal: (v.protein || 0) * 4, c: 'var(--protein)', g: v.protein }, { k: 'Karbo', kcal: (v.carbs || 0) * 4, c: 'var(--carbs)', g: v.carbs }, { k: 'Fett', kcal: (v.fat || 0) * 9, c: 'var(--fat)', g: v.fat }];
    var tot = parts.reduce(function (a, x) { return a + x.kcal; }, 0);
    if (!tot) return '';
    var r = 42, circ = 2 * Math.PI * r, off = 0, arcs = '';
    parts.forEach(function (x) {
      var len = x.kcal / tot * circ;
      if (len > 0) arcs += '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="' + x.c + '" stroke-width="12" stroke-dasharray="' + Math.max(0, len - 3).toFixed(1) + ' ' + circ.toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" stroke-linecap="round" transform="rotate(-90 55 55)"/>';
      off += len;
    });
    return '<div class="gcard donutcard"><div class="gch"><div><div class="gt">Fordeling</div><div class="gs">Andel av energien</div></div></div><div class="donutrow">' +
      '<div class="donut"><svg viewBox="0 0 110 110" width="110" height="110" aria-hidden="true"><circle cx="55" cy="55" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="12"/>' + arcs + '</svg><div class="dc"><span>kcal</span><b>' + fmt(v.kcal) + '</b></div></div>' +
      '<ul class="dleg">' + parts.map(function (x) { return '<li><i style="background:' + x.c + '"></i><span>' + x.k + '</span><b>' + Math.round(x.kcal / tot * 100) + ' %</b><em>' + fmt(x.g) + ' g</em></li>'; }).join('') + '</ul></div></div>';
  }

        (gd.totalKcal !== undefined && gd.totalKcal !== null ? '<div class="tile"><div class="k">Forbrent</div><div class="v">' + fmt(gd.totalKcal) + '<small>kcal</small></div><div class="t">' + (gd.activeKcal ? 'aktiv ' + fmt(gd.activeKcal) : 'Garmin') + (date === today() ? ' · så langt' : '') + '</div></div>' +

  /* ---------- Loggfør mat ----------
   * Ett sted å starte: skann, søk (dine varer, oppskrifter, Matvaretabellen, butikkvarer) eller lag din egen. */
  function recentProducts(n) {
    var out = [], seen = {};
    Array.from(S.days.keys()).sort().reverse().slice(0, 30).forEach(function (d) {
      var day = S.days.get(d);
      (day.meals || []).slice().reverse().forEach(function (m) { (m.items || []).forEach(function (i) {
        var p = i.productId && S.products.get(i.productId);
        if (p && !p.archived && !seen[p.id]) { seen[p.id] = 1; out.push(p); }
      }); });
    });
    return out.slice(0, n || 8);
  }
  function foodLi(p, attr, sub) {
    return '<button type="button" class="li" ' + attr + '><span class="av ' + esc(avClass(p)) + '" aria-hidden="true">' + esc((p.name || '?').charAt(0).toUpperCase()) + '</span><div class="grow"><div class="t1">' + esc(p.name) + '</div><div class="t2">' + esc(sub || [p.brand, E.stkWeight(p) && E.stkWeight(p).src !== 'pakning' ? '1 stk ≈ ' + fmt(E.stkWeight(p).g) + ' g' : ''].filter(Boolean).join(' · ')) + '</div></div>' +
      '<div class="kc">' + fmt(p.per100.kcal) + ' kcal<em>' + fmt(p.per100.protein, 1) + ' g P</em><span class="faint small">per 100 ' + (p.basis === 'ml' ? 'ml' : 'g') + '</span></div></button>';
  }
  function openFoodFinder(o) {
    o = o || {};
    var mode = o.mode || 'log', date = o.date || S.date, mt = o.mealType || null, timer = null, seq = 0;
    function after(p) {
      closeSheet();
      setTimeout(function () { if (mode === 'log') openAddItem(date, p.id, mt); else { toast('Lagret ' + p.name); openProduct(p.id); } }, 230);
    }
    openSheet(mode === 'log' ? 'Loggfør mat' : 'Legg til matvare', function (body) {
      body.innerHTML = '<div class="stack finder">' +
        '<div class="findtop"><button type="button" class="btn primary" id="ff_scan">' + ICON.barcode + 'Skann strekkode</button>' +
        '</div>' +
        '<input class="input" id="ff_q" type="search" enterkeyhint="search" placeholder="Søk, f.eks. banan eller kvarg" autocomplete="off">' +
        '<div id="ff_res"></div>' +
        '<button type="button" class="btn ghost ownbtn" id="ff_own">Finner du det ikke? <b>Lag din egen</b></button></div>';
      var res = $('#ff_res');
      function bind() {
        res.querySelectorAll('[data-pid]').forEach(function (b) { b.onclick = function () { after(S.products.get(b.dataset.pid)); }; });
        res.querySelectorAll('[data-mvt]').forEach(function (b) { b.onclick = async function () { try { after(await ensureProduct(mvtCache[b.dataset.mvt])); } catch (e) { toast(e.message); } }; });
        res.querySelectorAll('[data-rid]').forEach(function (b) { b.onclick = function () { closeSheet(); setTimeout(function () { openRecipe(b.dataset.rid); }, 230); }; });
        var ob = res.querySelector('[data-offq]'); if (ob) ob.onclick = function () { closeSheet(); setTimeout(function () { openOffSearch(ob.dataset.offq); }, 230); };
      }
      function run() {
        var q = $('#ff_q').value.trim(), my = ++seq;
        if (!q) {
          var rec = recentProducts(8);
          res.innerHTML = rec.length ? '<div class="fhead">Nylig brukt</div><div class="list">' + rec.map(function (p) { return foodLi(p, 'data-pid="' + esc(p.id) + '"'); }).join('') + '</div>' : '<p class="small muted" style="margin:4px 2px">Søk etter maten, eller skann strekkoden på pakken.</p>';
          bind(); return;
        }
        var own = C.findProducts(ctx, q, 8), nq = C.norm(q);
        var recs = mode === 'log' ? Array.from(S.recipes.values()).filter(function (r) { return C.norm(r.name).indexOf(nq) >= 0; }).slice(0, 4) : [];
        var html = (own.length ? '<div class="fhead">Dine matvarer</div><div class="list">' + own.map(function (p) { return foodLi(p, 'data-pid="' + esc(p.id) + '"'); }).join('') + '</div>' : '') +
          (recs.length ? '<div class="fhead">Oppskrifter</div><div class="list">' + recs.map(function (r) { return '<button type="button" class="li" data-rid="' + esc(r.id) + '"><span class="av a2" aria-hidden="true">R</span><div class="grow"><div class="t1">' + esc(r.name) + '</div><div class="t2">Oppskrift</div></div></button>'; }).join('') + '</div>' : '');
        res.innerHTML = html + '<div id="ff_mvt">' + (window.COACH_STANDALONE && q.length > 1 ? '<p class="small faint" style="margin:6px 2px">Søker i Matvaretabellen …</p>' : '') + '</div>' +
          (!window.COACH_STANDALONE && !own.length && !recs.length ? '<p class="small muted" style="margin:6px 2px">Ingen treff på «' + esc(q) + '» i matvarene dine. Matvaretabellen og butikkvarer kan du søke i fra Coach-appen på hjemskjermen. Her kan du lage varen selv.</p>' : '') +
          (window.COACH_STANDALONE ? '<button type="button" class="btn sm" data-offq="' + esc(q) + '">Søk i butikkvarer (Open Food Facts)</button>' : '');
        bind();
        if (!window.COACH_STANDALONE || q.length < 2) return;
        clearTimeout(timer);
        timer = setTimeout(async function () {
          var list = [], failed = false; try { list = await mvtSearch(q, 8); } catch (e) { list = []; failed = true; }
          if (my !== seq) return;
          var box = $('#ff_mvt'); if (!box) return;
          if (failed) { box.innerHTML = '<p class="small muted" style="margin:6px 2px">Fikk ikke kontakt med Matvaretabellen. Sjekk nettet og prøv igjen.</p>'; return; }
          var known = {}; own.forEach(function (p) { if (p.source && p.source.mvtId) known[p.source.mvtId] = 1; });
          list = list.filter(function (p) { return !known[p.mvtId]; });
          box.innerHTML = list.length ? '<div class="fhead">Matvaretabellen</div><div class="list">' + list.map(function (p) { return foodLi(p, 'data-mvt="' + esc(p.id) + '"', 'Matvaretabellen' + (E.stkWeight(p) && E.stkWeight(p).src === 'typisk' ? ' · 1 stk ≈ ' + fmt(E.stkWeight(p).g) + ' g' : '')); }).join('') + '</div>' : (own.length || recs.length ? '' : '<p class="small muted" style="margin:6px 2px">Ingen treff i Matvaretabellen.</p>');
          bind();
        }, 220);
      }
      var lastQ = null;
      function safeRun() {
        var q = $('#ff_q') ? $('#ff_q').value : '';
        if (q === lastQ) return; lastQ = q;
        try { run(); } catch (e) { res.innerHTML = '<div class="notice bad small">Søket feilet: ' + esc(e.message) + '</div>'; }
      }
      ['input', 'keyup', 'change', 'search'].forEach(function (ev) { $('#ff_q').addEventListener(ev, safeRun); });
      $('#ff_q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
      $('#ff_scan').onclick = function () { closeSheet(); setTimeout(scanBarcode, 120); };
      $('#ff_own').onclick = function () { var q = $('#ff_q').value.trim(); closeSheet(); setTimeout(function () { openQuickProduct({ name: q }, { mode: mode, date: date, mealType: mt }); }, 230); };
      safeRun();
    });
  }

        var miss = [['qp_kcal', 'kalorier'], ['qp_protein', 'protein'], ['qp_carbs', 'karbohydrater'], ['qp_fat', 'fett']].filter(function (x) { return E.num(v(x[0])) === null; });
